# Headless service for direct pod-IP resolution.
# Used by the EDP celery workers to distribute extraction requests
# evenly across all text-extractor replicas via DNS A-record lookup,
# bypassing kube-proxy load balancing which can be sticky.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.textExtractor.nameOverride | default (include "helm-edp.fullname" .) }}-headless
  labels:
    {{- include "helm-edp.textExtractor.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9398
      targetPort: 9398
      protocol: TCP
      name: http
  selector:
    {{- include "helm-edp.textExtractor.selectorLabels" . | nindent 4 }}
{{- end }}
