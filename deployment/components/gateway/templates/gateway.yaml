{{- /*
Copyright (C) 2024-2026 Intel Corporation
SPDX-License-Identifier: Apache-2.0

Gateway — the traffic entry point. Equivalent to the old ingress-nginx controller Service.
Listeners define ports/protocols/TLS. Routes from ANY namespace can attach via parentRefs.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "erag-gateway.labels" . | nindent 4 }}
  annotations:
    networking.istio.io/service-type: {{ .Values.gateway.serviceType | quote }}
spec:
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ .Values.gateway.name }}-config
  gatewayClassName: {{ .Values.gatewayClass.name }}
  listeners:
    - name: {{ .Values.gateway.listeners.http.name }}
      protocol: {{ .Values.gateway.listeners.http.protocol }}
      port: {{ .Values.gateway.listeners.http.port }}
      allowedRoutes:
        namespaces:
          from: All
    {{- if .Values.gateway.listeners.https.enabled }}
    - name: {{ .Values.gateway.listeners.https.name }}
      protocol: {{ .Values.gateway.listeners.https.protocol }}
      port: {{ .Values.gateway.listeners.https.port }}
      tls:
        mode: {{ .Values.gateway.listeners.https.tls.mode }}
        certificateRefs:
          - name: {{ .Values.gateway.listeners.https.tls.certificateRef.name }}
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
