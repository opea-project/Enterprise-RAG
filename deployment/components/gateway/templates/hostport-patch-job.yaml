{{- /*
Copyright (C) 2024-2026 Intel Corporation
SPDX-License-Identifier: Apache-2.0

Post-install/upgrade Job — patches the Istio auto-provisioned gateway Deployment
to add hostPort bindings for :80 and :443.  This is required on bare-metal nodes
that lack MetalLB / kube-vip.

Istio uses server-side apply and only manages its own ports (15020/15021/15090).
Our hostPort entries get their own field-manager ("kubectl-patch") and survive
normal Istio reconciliation.
*/ -}}
{{- if .Values.gateway.hostPort.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.gateway.name }}-hostport-patcher
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "erag-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.gateway.name }}-hostport-patcher
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "erag-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.gateway.name }}-hostport-patcher
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "erag-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.gateway.name }}-hostport-patcher
subjects:
  - kind: ServiceAccount
    name: {{ .Values.gateway.name }}-hostport-patcher
    namespace: {{ .Values.gateway.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.gateway.name }}-hostport-patch
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "erag-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.gateway.name }}-hostport-patch
    spec:
      serviceAccountName: {{ .Values.gateway.name }}-hostport-patcher
      restartPolicy: OnFailure
      containers:
        - name: patch
          image: {{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -exc
            - |
              DEPLOY="{{ .Values.gateway.name }}-istio"
              NS="{{ .Values.gateway.namespace }}"
              HTTP_PORT={{ .Values.gateway.hostPort.httpPort }}
              HTTPS_PORT={{ .Values.gateway.hostPort.httpsPort }}

              echo "Waiting for deployment ${DEPLOY} in ${NS}..."
              for i in $(seq 1 60); do
                if kubectl get deploy "${DEPLOY}" -n "${NS}" >/dev/null 2>&1; then
                  break
                fi
                echo "  attempt ${i}/60 — deployment not found yet..."
                sleep 5
              done

              echo "Patching deployment ${DEPLOY} with hostPort ${HTTP_PORT}/${HTTPS_PORT}..."
              kubectl patch deploy "${DEPLOY}" -n "${NS}" --type='json' -p="[
                {\"op\": \"add\", \"path\": \"/spec/template/spec/containers/0/ports/-\",
                 \"value\": {\"containerPort\": ${HTTP_PORT}, \"hostPort\": ${HTTP_PORT}, \"name\": \"http\", \"protocol\": \"TCP\"}},
                {\"op\": \"add\", \"path\": \"/spec/template/spec/containers/0/ports/-\",
                 \"value\": {\"containerPort\": ${HTTPS_PORT}, \"hostPort\": ${HTTPS_PORT}, \"name\": \"https\", \"protocol\": \"TCP\"}}
              ]" || echo "Ports may already exist — checking..."

              # Verify the ports are present
              kubectl get deploy "${DEPLOY}" -n "${NS}" \
                -o jsonpath='{.spec.template.spec.containers[0].ports}' | grep -q "hostPort"
              echo "hostPort patch verified successfully."
{{- end }}
