Copyright (C) 2024-2026 Intel Corporation
SPDX-License-Identifier: Apache-2.0

HTTP → HTTPS redirect (301).
A catch-all HTTPRoute on the HTTP listener that redirects ALL traffic to the
HTTPS listener.  This ensures users hitting http://erag.com are automatically
sent to https://erag.com.

This route only attaches to the "http" listener via sectionName, so it does not
interfere with the HTTPS routes.
*/ -}}
{{- if .Values.httpToHttpsRedirect.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "erag-gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.listeners.http.name }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
