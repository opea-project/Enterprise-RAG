SPDX-License-Identifier: Apache-2.0

HTTPRoutes — one per service, replaces legacy Ingress resources.
Each route lives in the app's namespace and points back to the Gateway via parentRefs.
These are 100% backend-agnostic (work with APISIX, Envoy, Istio, etc).
*/ -}}
{{- range .Values.routes }}
{{- if .enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    {{- include "erag-gateway.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: https
  {{- if .hostnames }}
  hostnames:
    {{- range .hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .rules }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path }}
      {{- if .timeouts }}
      timeouts:
        {{- if .timeouts.request }}
        request: {{ .timeouts.request }}
        {{- end }}
        {{- if .timeouts.backendRequest }}
        backendRequest: {{ .timeouts.backendRequest }}
        {{- end }}
      {{- end }}
      {{- if .urlRewrite }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .urlRewrite.replacePrefixMatch | default "/" }}
      {{- end }}
      backendRefs:
        - name: {{ .backendRef.name }}
          port: {{ .backendRef.port }}
    {{- end }}
{{- end }}
{{- end }}
