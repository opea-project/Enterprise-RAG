# Gateway API configuration for Enterprise RAG
# Replaces ingress-nginx with standard Kubernetes Gateway API
# Backend-agnostic: works with APISIX, Envoy Gateway, Istio, etc.

gatewayClass:
  # Use the built-in Istio GatewayClass (already ACCEPTED on the cluster).
  # To swap to another backend (Envoy, APISIX, Cilium), change name + controllerName.
  # HTTPRoutes stay IDENTICAL regardless.
  name: istio
  controllerName: istio.io/gateway-controller

gateway:
  name: erag-gateway
  namespace: erag-gateway
  listeners:
    http:
      name: http
      port: 80
      protocol: HTTP
    https:
      enabled: true
      name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRef:
          name: tls-secret
  # Bare-metal exposure mode:
  #   hostPort  — bind :80/:443 directly on the node (no LB needed, single-node)
  #   NodePort  — use high-port NodePort (30080/30443)
  #   LoadBalancer — use MetalLB / kube-vip / cloud LB
  serviceType: ClusterIP            # ClusterIP when using hostPort
  # externalTrafficPolicy:
  #   Local  — preserves source IP; MetalLB only announces from nodes running the gateway pod.
  #            Required when the upstream router (e.g. pfSense) uses stateful connection tracking.
  #   Cluster — default Kubernetes behaviour; IPVS masquerades source IP.
  externalTrafficPolicy: Cluster
  hostPort:
    enabled: true                   # bind :80/:443 directly on the node (no LB needed)
    httpPort: 80
    httpsPort: 443
  # NOTE: when hostPort is enabled, the generated gateway Deployment uses
  # strategy.type=Recreate (set in gateway-config.yaml) to avoid Pending pods
  # during upgrades. This can cause brief downtime while the old pod stops and
  # the new pod starts. Future improvement: switch to NodePort/LoadBalancer or
  # multi-node hostPort with anti-affinity for zero/near-zero downtime rollouts.
  # Resources for the auto-provisioned Istio gateway proxy container.
  # Increase these when you observe 503s / throttling under load.
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "4"
      memory: "2Gi"
  # Number of worker threads for Envoy proxy (0 = one per CPU core).
  concurrency: 0

  # Envoy listener tuning for HTTPS (port 443).
  # Prevents SSL EOF errors under burst TCP+TLS connections by tuning
  # timeouts, connection balancing, and TLS inspector buffer sizes.
  listenerTuning:
    enabled: true
    listenerFiltersTimeout: "30s"
    continueOnTimeout: true
    initialReadBufferSize: 65535

# HTTP → HTTPS redirect (301)
# A catch-all HTTPRoute on the HTTP listener that redirects all traffic to HTTPS.
httpToHttpsRedirect:
  enabled: true

# HTTPRoutes managed by the gateway chart.
# Only services WITHOUT their own component chart are listed here.
# UI, Keycloak, Grafana HTTPRoutes are now owned by their respective component charts.
routes:
  - name: seaweedfs-admin-route
    enabled: true
    namespace: seaweedfs
    hostnames:
      - "seaweedfs.erag.com"
    rules:
      - path: /
        pathType: PathPrefix
        backendRef:
          name: seaweedfs-admin
          port: 23646

  - name: seaweedfs-s3-route
    enabled: true
    namespace: seaweedfs
    hostnames:
      - "s3.erag.com"
    rules:
      - path: /
        pathType: PathPrefix
        timeouts:
          request: 3600s
          backendRequest: 3600s
        backendRef:
          name: seaweedfs-s3
          port: 8333
