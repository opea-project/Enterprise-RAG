---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: mcp-gateway
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app: mcp-gateway
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
