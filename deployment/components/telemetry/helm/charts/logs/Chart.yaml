apiVersion: v2
name: logs
type: application
version: 1.0.6
appVersion: "2.3.0"
annotations:
  app.kubernetes.io/part-of: ERAG

dependencies:

# enabled by default
- name: loki
  condition: loki.enabled
  repository: https://grafana.github.io/helm-charts
  # Last OSS-compatible release of the grafana/loki chart (chart 7.x is GEL-only).
  # See: https://artifacthub.io/packages/helm/grafana/loki
  version: 6.55.0

- name: opentelemetry-collector
  version: 0.136.1
  alias: otelcol-logs
  condition: otelcol-logs.enabled
  repository: https://open-telemetry.github.io/opentelemetry-helm-charts
