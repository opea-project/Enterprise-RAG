apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qdrant-metrics
  labels:
    release: {{.Release.Name}}
spec:
  namespaceSelector:
    matchNames:
    - vdb
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
      # Selects the headless service only, so the same pod is not scraped twice.
      app.kubernetes.io/component: cluster-discovery
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    # Qdrant serves /metrics on the same port as the API and requires the api key.
    authorization:
      type: Bearer
      credentials:
        name: vector-database-config
        key: QDRANT_READ_ONLY_API_KEY
    relabelings:
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
      action: replace
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
      action: replace
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
      action: replace
    - sourceLabels: [__meta_kubernetes_service_name]
      targetLabel: service
      action: replace
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: instance
      action: replace
    - sourceLabels: [__address__]
      targetLabel: addr
      action: replace
    - sourceLabels: [__meta_kubernetes_pod_ip]
      separator: ':'
      regex: (.*)
      targetLabel: pod_ip
      replacement: ${1}
      action: replace
{{- end }}
