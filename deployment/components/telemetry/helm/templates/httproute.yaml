SPDX-License-Identifier: Apache-2.0

HTTPRoute — routes traffic from the shared Gateway to the Grafana service.
Replaces the legacy kube-prometheus-stack.grafana.ingress.  Backend-agnostic.
*/ -}}
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: telemetry-grafana
    app.kubernetes.io/part-of: ERAG
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gatewayRef.name }}
      namespace: {{ .Values.httpRoute.gatewayRef.namespace }}
      sectionName: {{ .Values.httpRoute.gatewayRef.sectionName | default "https" }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.pathPrefix | default "/" }}
      backendRefs:
        - name: {{ .Values.httpRoute.backendRef.name | default "telemetry-grafana" }}
          port: {{ .Values.httpRoute.backendRef.port | default 80 }}
{{- end }}
