# Set on the command line:
vector_database_password:
vector_database_name:
vector_database_username:

pgvector:
  enabled: false
  image:
    repository: "pgvector/pgvector"
    tag: "0.8.1-pg18-trixie"
  persistence:
    enabled: true
    size: "10Gi"
  resources:
    requests:
      cpu: 2
      memory: 4Gi
    limits:
      cpu: 16
      memory: 16Gi

mssql:
  enabled: false
  metrics:
    enabled: true
  image:
    repository: "mcr.microsoft.com/mssql/server" # https://mcr.microsoft.com/en-us/artifact/mar/mssql/server
    tag: "2025-RTM-ubuntu-22.04"
  serviceAccount:
    name: mssql
  config:
    accept_eula: "N"
    mssql_pid: "Express"
  persistence:
    enabled: true
    dataSize: "10Gi"
    logSize: "2Gi"
    secretsSize: "1Gi"
  resources:
    requests:
      cpu: 2
      memory: 4Gi
    limits:
      cpu: 16
      memory: 16Gi

qdrant:
  enabled: false
  replicaCount: 1
  image:
    repository: docker.io/qdrant/qdrant
    tag: "v1.19.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    # p2p (6335) is intentionally omitted: single-node, clustering disabled.
    ports:
      - name: http
        port: 6333
        targetPort: 6333
        protocol: TCP
        checksEnabled: true
      - name: grpc
        port: 6334
        targetPort: 6334
        protocol: TCP
        checksEnabled: false
  env:
    - name: QDRANT__SERVICE__API_KEY
      valueFrom:
        secretKeyRef:
          name: vector-database-config
          key: QDRANT_API_KEY
    - name: QDRANT__SERVICE__READ_ONLY_API_KEY
      valueFrom:
        secretKeyRef:
          name: vector-database-config
          key: QDRANT_READ_ONLY_API_KEY
  persistence:
    accessModes: ["ReadWriteOnce"]
    size: "20Gi"
    storageClassName: ""
  snapshotPersistence:
    enabled: true
    accessModes: ["ReadWriteOnce"]
    size: "20Gi"
    storageClassName: ""
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
    successThreshold: 1
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 4
      memory: 6Gi
  containerSecurityContext:
    capabilities:
      drop:
      - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
  podSecurityContext:
    fsGroup: 3000
    fsGroupChangePolicy: Always
  config:
    # Single instance, no consensus. The subchart defaults this to true.
    cluster:
      enabled: false
    service:
      enable_tls: false
      enable_static_content: false
      enable_cors: false
    telemetry_disabled: true
    storage:
      # On-disk profile is the default. Payloads stay off the heap; the HNSW
      # graph is deliberately left in RAM, since a cold HNSW graph destroys
      # query latency.
      on_disk_payload: true
      optimizers:
        default_segment_number: 2
        flush_interval_sec: 5
      wal:
        wal_capacity_mb: 32
      quotas:
        enabled: true
        max_disk_usage_percent: 90

redis-cluster:
  enabled: true
  image:
    repository: redis
  serviceAccount:
    name: vdb-redis-cluster
  metrics:
    enabled: true
    image:
      repository: oliver006/redis_exporter
      tag: v1.80.0
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  existingSecret: "redis-cluster-secret"
  existingSecretPasswordKey: "REDIS_PASSWORD"
  networkPolicy:
    extraIngress:
      - ports:
        - port: 15008
  cluster:
    nodes: 3
    replicas: 0
  redis:
    image:
      repository: redis
      tag: 8.2.2
      pullPolicy: IfNotPresent
    readinessProbe:
      enabled: false
      initialDelaySeconds: 180
      periodSeconds: 10
      timeoutSeconds: 10
    livenessProbe:
      enabled: false
      initialDelaySeconds: 240
      periodSeconds: 10
      timeoutSeconds: 10
    configmap: |-
      # Cluster timeout
      cluster-node-timeout 15000

      # Load Redis modules with their configuration
      loadmodule /usr/local/lib/redis/modules/redisearch.so MAXSEARCHRESULTS 10000 MAXAGGREGATERESULTS 10000 TIMEOUT 5000
      loadmodule /usr/local/lib/redis/modules/rejson.so MAXDEPTH 1000
    resources:
      requests:
        cpu: 250m
        memory: 500Mi
      limits:
        cpu: 4
        memory: 16Gi
  persistence:
    size: "10Gi"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000

securityContextWithTemp:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
