# Uses Kubespray to deploy Kubernetes cluster and install required components
deploy_k8s: false
k8s_version: "1.33.5"

# versions installed via infrastructure playbook:
# 1.32.9, 1.33.5
# 1.32.11,1.33.7,1.34.2 installation is not being supported by infrastructure.yaml

# Available options:
# - "local-path-provisioner": Use for single-node deployment. Local path provisioner works only with Kubespray deployment, so deploy_k8s needs to be true to install it
# - "nfs": Use for multi-node deployment or single node with velero backup functionality; can be installed on existing K8s cluster using infrastructure playbook
# - "netapp-trident": Use for NetApp ONTAP storage with Trident CSI driver; can be installed on existing K8s cluster using infrastructure playbook
install_csi: "local-path-provisioner"

# please use variables local_registry and insecure_registry together
# set to true to install registry on K8s , set insecure registry to be able to push and pull images from registry on defined node and defined port.
local_registry: false
#insecure_registry: "<node-name>:32000"

# Setup when install_csi is "nfs"
# Setup NFS server when working on a multi-node cluster which does not have a StorageClass with RWX capability.
# Setting nfs_server_enabled to true will install NFS server together with CSI driver
# and set nfs_csi_storage_class as the default one.
nfs_node_name: "master-1"            # K8s node name on which to set up NFS server
nfs_host_path: "/opt/nfs-data"       # Host path on the K8s node for NFS server
nfs_csi_driver_version: "4.11.0"
nfs_csi_storage_class: "nfs-csi"

# Setup when install_csi is "netapp-trident"
# Configure NetApp Trident CSI driver for ONTAP storage
# Requires existing NetApp ONTAP system with configured SVM
trident_operator_version: "2510.0"    # Trident operator version (becomes 100.2510.0 in Helm chart)
trident_namespace: "trident"          # Kubernetes namespace for Trident
trident_storage_class: "netapp-trident" # StorageClass name for Trident
trident_backend_name: "ontap-nas"     # Backend configuration name
# ONTAP Backend Configuration - FILL THESE VALUES
ontap_management_lif: ""              # ONTAP management LIF IP address
ontap_data_lif: ""                    # ONTAP data LIF IP address
ontap_svm: ""                         # Storage Virtual Machine (SVM) name
ontap_username: ""                    # ONTAP username with admin privileges
ontap_password: ""                    # ONTAP password

# Set to true to expose the external storage backend (ontap_data_lif) through the gateway
# as a reverse proxy at s3.<FQDN>. Requires ontap_data_lif and gateway.enabled to be set.
reverse_proxy_storage: false          # Enable reverse proxy for external storage backend

huggingToken: "" # Huggingface token is required for gated/private models

# Provide absolute path to kubeconfig (e.g. /home/ubuntu/.kube/config).
# If you are installing K8s cluster in simplified deployment, your kubeconfig will be created in path "<repository path>/deployment/inventory/test-cluster/artifacts/admin.conf"
kubeconfig: FILL_HERE  # Provide absolute path to kubeconfig (e.g. /home/ubuntu/.kube/config)

httpProxy: ""
httpsProxy: ""
# If HTTP/HTTPS proxy is set, you can specify additional noProxy entries:
# Common entries like localhost,.svc,.monitoring,.monitoring-traces are automatically added
additionalNoProxy: "" #"custom.domain.com,192.168.1.0/24"

FQDN: "erag.com" # Provide the FQDN for the deployment

# Routing mode: how external services (Keycloak, Grafana, S3, etc.) are exposed.
#   "subdomain" - each service gets its own subdomain (auth.erag.com, grafana.erag.com, s3.erag.com)
#                  Requires wildcard DNS or individual DNS records per service.
#   "path"      - all services share the single FQDN under different paths (erag.com/auth, erag.com/grafana, erag.com/s3)
#                  Only a single DNS record is needed. Recommended for cloud deployments.
routing_mode: "subdomain"

gaudi_operator: false # set to true when Gaudi operator is to be installed
habana_driver_version: "1.24.0-1007" # gaudi device plugin from https://github.com/HabanaAI/gaudi-device-plugin/tags

# If you want to use certificates, set autoGenerated to false and provide the paths to the cert and key
certs:
  autoGenerated: true # Generate self-signed certs
  pathToCert: "" # Provide absolute path to cert
  pathToKey: "" # Provide absolute path to key

# For cluster-level services to use prepared certificates, set autoGenerated to false and provide the paths to the cert and key
clusterCerts:
  autoGenerated: true # Generate self-signed certs
  pathToCert: "" # Provide absolute path to cert
  pathToKey: "" # Provide absolute path to key

registry: "docker.io/opea" # alternatively "localhost:5000/erag" for local registry
# tag: "2.2.0" # Omit to use default tag matching solution version (recommended). Must contain solution version if set.
# tag_override: false # Set to true to bypass version check for custom tagging policies (e.g. "latest", "april-2026")
setup_registry: true
use_alternate_tagging: false
helm_timeout: "10m0s"

hpaEnabled: true
enforcePSS: true

# Pin ERAG pods to specific node(s) via PodNodeSelector admission controller.
# Requires PodNodeSelector admission plugin enabled on the cluster.
# The annotation scheduler.alpha.kubernetes.io/node-selector is applied to all ERAG namespaces.
# Example: {"kubernetes.io/hostname": "worker-node-1"}
# Empty dict {} means no pinning (pods schedule anywhere).
namespace_node_selector: {}
# namespace_node_selector:
#   kubernetes.io/hostname: "your-node-name"

tdx: # enables Intel® Trust Domain Extensions
  enabled: false

solution_language: "auto"

# No LLM deployed for MCP retrieval-only pipeline, but GMC chart requires a non-empty value
llm_model: "no-llm"
llm_model_gaudi: "no-llm"
embedding_model_name: "BAAI/bge-base-en-v1.5"
reranking_model_name: "BAAI/bge-reranker-base"

# Topology-aware resource scheduling and CPU pinning for vLLM
# For detailed documentation, refer to: deployment/components/nri-plugin/README.md
balloons:
  enabled: true
  namespace: kube-system # alternatively, set custom namespace for balloons
  wait_timeout: 300 # timeout in seconds to wait for nri-plugin to be in ready state
  throughput_mode: true # set to true to optimize for horizontal scaling
  memory_overcommit_buffer: 0.1 # buffer (% of total memory) for pods using more memory than initially requested; valid range: 0.0 to 1.0
  max_replicas_per_node: 10 # maximum number of each inference service replicas per node; helps to limit overloading nodes with too many pods
  allowed_numa_nodes: [] # restrict balloons to specific NUMA node IDs (e.g. [0] or [0, 1]); empty = use all; single-node deployments only
  vllm_custom_name: "" # Optional: Custom container name reference for vLLM balloon

# Pipeline configuration mode
# Set to true to use upload-optimized pipeline (embedding + model server only)
# Set to false to use default full pipeline (embedding, retrieval, reranking, LLM)
# Can be overridden via CLI: -e upload_pipelines=true
# Note: The upload pipeline configuration (upload_pipelines_config) is defined in application.yaml
upload_pipelines: false

# MCP retrieval-only pipeline: embedding, retriever, reranker (no LLM)
pipelines:
  - namespace: mcp
    samplePath: mcp/reference-cpu.yaml
    resourcesPath: mcp/resources-reference-cpu.yaml
    modelConfigPath: chatqa/resources-model-cpu.yaml
    type: mcp

gmc:
  enabled: true
  pvc:
    accessMode: ReadWriteOnce
    models:
      modelEmbedding:
        name: model-volume-embedding
        storage: 20Gi
      modelReranker:
        name: model-volume-reranker
        storage: 10Gi

velero:
  enabled: false

telemetry:
  enabled: true
  traces:
    enabled: false
  logging:
    enabled: true

chat_maintenance_mode: true

mcp:
  enabled: true # Set to true to deploy MCP gateway. Agents authenticate via X-MCP-Client-ID + X-MCP-Client-Secret (client_credentials grant).

edp:
  enabled: true
  dpGuard:
    enabled: false
  rbac:
    enabled: false
  storageType: seaweedfs
  s3:
    region: "us-east-1"
    accessKeyId: ""
    secretAccessKey: ""
    sqsEventQueueUrl: ""
    bucketNameRegexFilter: ".*"
  s3compatible:
    region: "us-east-1"
    accessKeyId: ""
    secretAccessKey: ""
    internalUrl: "https://s3.example.com"
    externalUrl: "https://s3.example.com"
    bucketNameRegexFilter: ".*"
  hierarchical_indices:
    enabled: false
  semantic_chunking:
    enabled: false
  late_chunking:
    enabled: false

rag_utils:
  enabled: true

chat_history:
  enabled: false

vector_databases:
  enabled: true
  namespace: vdb
  vector_store: redis-cluster
  vector_datatype: FLOAT32
