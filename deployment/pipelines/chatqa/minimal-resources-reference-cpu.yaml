# minimal-resources-reference-cpu.yaml
# Minimal resource profile for deployment on hardware with 65 vCPUs and 128 GB RAM.
# For configuration instructions see: docs/minimum_requirements.md
#
# Key changes vs resources-reference-cpu.yaml:
#   - vllm: 16 CPU cores, 1 replica, HPA min/max = 1, memory capped at 16 Gi
#   - All other inference services: replicas=1, HPA min/max=1
#   IMPORTANT: Set VLLM_CPU_KVCACHE_SPACE: "1" in pipelines/chatqa/resources-model-cpu.yaml

services:
  embedding-usvc:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 1
        memory: 1Gi
  fingerprint-usvc:
    replicas: 1
    resources:
      requests:
        memory: 64Mi
        cpu: 0.25
      limits:
        memory: 1Gi
        cpu: 0.5
  query-rewrite-usvc:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi
  vllm_query_rewrite:
    replicas: 1
    resources:
      requests:
        cpu: 16
        memory: 16Gi
      limits:
        cpu: 16
        memory: 16Gi
  in-guard-usvc:
    replicas: 1
    resources:
      requests:
        cpu: 500n
        memory: 1Gi
      limits:
        cpu: 4
        memory: 8Gi
    hpa:
      minReplicas: 1
      maxReplicas: 1
      AverageValue: 1
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
          - type: Percent
            value: 25
            periodSeconds: 15
          - type: Pods
            value: 1
            periodSeconds: 60
        scaleUp:
          selectPolicy: Max
          stabilizationWindowSeconds: 120
          policies:
          - type: Percent
            value: 25
            periodSeconds: 15
          - type: Pods
            value: 1
            periodSeconds: 60
  llm-usvc:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 1
        memory: 1Gi
  out-guard-usvc:
    replicas: 1
    resources:
      requests:
        cpu: 4
        memory: 8Gi
      limits:
        cpu: 8
        memory: 16Gi
    hpa:
      minReplicas: 1
      maxReplicas: 1
      AverageValue: 5
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
          - type: Percent
            value: 25
            periodSeconds: 120
          - type: Pods
            value: 1
            periodSeconds: 120
        scaleUp:
          selectPolicy: Max
          stabilizationWindowSeconds: 60
          policies:
          - type: Percent
            value: 25
            periodSeconds: 120
          - type: Pods
            value: 1
            periodSeconds: 120
  prompt-template-usvc:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 150Mi
      limits:
        cpu: 500m
        memory: 500Mi
  reranking-usvc:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 1
        memory: 500Mi
  retriever-usvc:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 250Mi
      limits:
        cpu: 1
        memory: 1Gi
  teirerank:
    replicas: 1
    resources:
      requests:
        cpu: 2
        memory: 16Gi
      limits:
        cpu: 8
        memory: 32Gi
    hpa:
      minReplicas: 1
      maxReplicas: 1
      AverageValue: 2
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 180
          policies:
          - type: Percent
            value: 25
            periodSeconds: 120
        scaleUp:
          selectPolicy: Max
          stabilizationWindowSeconds: 0
          policies:
          - type: Percent
            value: 50
            periodSeconds: 15
          - type: Pods
            value: 1
            periodSeconds: 15
  tei:
    replicas: 1
    resources:
      requests:
        cpu: 8
        memory: 8Gi
      limits:
        cpu: 16
        memory: 16Gi
  torchserve_embedding:
    replicas: 1
    resources:
      requests:
        cpu: 4
        memory: 4Gi
      limits:
        cpu: 4
        memory: 16Gi
    hpa:
      minReplicas: 1
      maxReplicas: 1
      targetValue: 0.5
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 180
          policies:
          - type: Percent
            value: 25
            periodSeconds: 30
          - type: Pods
            value: 1
            periodSeconds: 15
        scaleUp:
          stabilizationWindowSeconds: 30
          selectPolicy: Max
          policies:
          - type: Pods
            value: 1
            periodSeconds: 15
  vllm_embedding:
    replicas: 1
    resources:
      requests:
        cpu: 4
        memory: 2Gi
      limits:
        cpu: 4
        memory: 8Gi
    hpa:
      minReplicas: 1
      maxReplicas: 1
      targetValue: 50
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 180
          policies:
          - type: Percent
            value: 25
            periodSeconds: 90
        scaleUp:
          stabilizationWindowSeconds: 60
          selectPolicy: Max
          policies:
          - type: Pods
            value: 1
            periodSeconds: 90
  torchserve_reranking:
    replicas: 1
    resources:
      requests:
        cpu: 4
        memory: 4Gi
      limits:
        cpu: 4
        memory: 16Gi
    hpa:
      minReplicas: 1
      maxReplicas: 1
      targetValue: 1000m
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 180
          policies:
          - type: Percent
            value: 25
            periodSeconds: 120
        scaleUp:
          selectPolicy: Max
          stabilizationWindowSeconds: 0
          policies:
          - type: Percent
            value: 50
            periodSeconds: 15
          - type: Pods
            value: 1
            periodSeconds: 15
  vllm:
    replicas: 1
    # NOTE:
    # When balloons policy is NOT enabled, CPU and memory from the resources block below are applied.
    # When balloons policy is enabled, vllm resources must be defined in inventory config.yaml as balloons.services.vllm.resources
    # IMPORTANT: Set VLLM_CPU_KVCACHE_SPACE: "1" in pipelines/chatqa/resources-model-cpu.yaml
    #            to limit KV cache memory usage on minimum hardware.
    resources:
      requests:
        cpu: 16
        memory: 16Gi
      limits:
        cpu: 16
        memory: 16Gi
    hpa:
      minReplicas: 1
      maxReplicas: 1
      targetValue: 100m
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 180
          policies:
          - type: Percent
            value: 25
            periodSeconds: 90
        scaleUp:
          selectPolicy: Max
          stabilizationWindowSeconds: 60
          policies:
          - type: Pods
            value: 1
            periodSeconds: 90
