# User-configurable parameters (can be set via --set during helm install)


modelConfigs:
  generic-base-cpu: &generic_base_cpu
    configMapValues:
      XDG_CACHE_HOME: "/tmp"
      VLLM_BLOCK_SIZE: "128"
      VLLM_MAX_NUM_BATCHED_TOKENS: "2048"
      VLLM_DATA_PARALLEL_SIZE: "1"
      VLLM_CPU_KVCACHE_SPACE: "10"
      VLLM_DTYPE: "bfloat16"
      VLLM_MAX_NUM_SEQS: "256"
      VLLM_TP_SIZE: "1"
      VLLM_PP_SIZE: "1"
      VLLM_RPC_TIMEOUT: "100000"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_ENGINE_ITERATION_TIMEOUT_S: "120"
      VLLM_CPU_SGL_KERNEL: "1"
      VLLM_MAX_MODEL_LEN: "4096"
    extraCmdArgs: ["--distributed-executor-backend", "mp", "--pipeline-parallel-size", "$(VLLM_PP_SIZE)", "--dtype", "$(VLLM_DTYPE)", "--max_model_len", "$(VLLM_MAX_MODEL_LEN)", "--max-num-seqs", "$(VLLM_MAX_NUM_SEQS)","--download-dir", "/data"]
    tensor_parallel_size: "1" # not applied on CPU

  generic-base-awq-cpu: &generic_base_awq_cpu
    configMapValues:
      XDG_CACHE_HOME: "/tmp"
      VLLM_BLOCK_SIZE: "128"
      VLLM_MAX_NUM_BATCHED_TOKENS: "2048"
      VLLM_DATA_PARALLEL_SIZE: "1"
      VLLM_CPU_KVCACHE_SPACE: "10"
      VLLM_CPU_INT4_W4A8: "1"
      VLLM_CPU_SGL_KERNEL: "1"
      VLLM_DTYPE: "bfloat16"
      VLLM_MAX_NUM_SEQS: "256"
      VLLM_TP_SIZE: "1"
      VLLM_PP_SIZE: "1"
      VLLM_RPC_TIMEOUT: "100000"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_ENGINE_ITERATION_TIMEOUT_S: "120"
      VLLM_MAX_MODEL_LEN: "4096"
    extraCmdArgs: ["--distributed-executor-backend", "mp", "--pipeline-parallel-size", "$(VLLM_PP_SIZE)", "--dtype", "$(VLLM_DTYPE)", "--max_model_len", "$(VLLM_MAX_MODEL_LEN)", "--max-num-seqs", "$(VLLM_MAX_NUM_SEQS)","--download-dir", "/data", "--quantization", "awq"]
    tensor_parallel_size: "1" # not applied on CPU

  "TechxGenus/Meta-Llama-3-8B-Instruct-AWQ":
    <<: *generic_base_awq_cpu

  "solidrust/Llama-3-13B-Instruct-v0.1-AWQ":
    <<: *generic_base_awq_cpu

  "MaziyarPanahi/Llama-3-13B-Instruct-v0.1":
    <<: *generic_base_cpu

  "TheBloke/neural-chat-7B-v3-3-AWQ":
    <<: *generic_base_awq_cpu

  "Intel/neural-chat-7b-v3-3":
    <<: *generic_base_cpu

  "casperhansen/llama-3-8b-instruct-awq":
    <<: *generic_base_awq_cpu

  "meta-llama/Llama-3.1-8B-Instruct":
    <<: *generic_base_cpu

  "hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4":
    <<: *generic_base_awq_cpu

  "haoranxu/ALMA-7B-R":
    <<: *generic_base_cpu
    modelChatTemplate: |
      {%- for message in messages if message['role'] != 'system' -%}
        {%- if message['role'] == 'user' -%}
          {{- "<s>[INST] " + message['content'].strip() + " [/INST]" -}}
        {%- elif message['role'] == 'assistant' -%}
          {{- " " + message['content'].strip() + " </s>" -}}
        {%- endif -%}
      {%- endfor -%}
      {%- if add_generation_prompt -%}
        <s>[INST]
      {%- endif -%}

  "Qwen/Qwen3-14B":
    <<: *generic_base_cpu

  "Qwen/Qwen3-14B-AWQ":
    <<: *generic_base_awq_cpu

  "mistralai/Mistral-7B-Instruct-v0.3":
    <<: *generic_base_cpu

  "solidrust/Mistral-7B-Instruct-v0.3-AWQ":
    <<: *generic_base_awq_cpu
    modelChatTemplate: |
      {%- if messages[0]['role'] == 'system' %}
        {%- set system_message = messages[0]['content'] %}
        {%- set loop_messages = messages[1:] %}\n{%- else %}
        {%- set loop_messages = messages %}
      {%- endif %}
      {{- bos_token }}
      {%- for message in loop_messages %}
        {%- if (message['role'] == 'user') != (loop.index0 % 2 == 0) %}
          {{- raise_exception('After the optional system message, conversation roles must alternate user/assistant/user/assistant/...') }}
        {%- endif %}
        {%- if message['role'] == 'user' %}
          {%- if loop.first and system_message is defined %}
            {{- ' [INST] ' + system_message + '\\n\\n' + message['content'] + ' [/INST]' }}
          {%- else %}
            {{- ' [INST] ' + message['content'] + ' [/INST]' }}
          {%- endif %}
        {%- elif message['role'] == 'assistant' %}
          {{- ' ' + message['content'] + eos_token}}
      {%- else %}
        {{- raise_exception('Only user and assistant roles are supported, with the exception of an initial optional system message!') }}
      {%- endif %}
      {%- endfor %}

# Polish language models
# Attention!
# If you use these models, make sure to ajust embedding and reranking models accordingly to support Polish language well.
  "CYFRAGOVPL/Llama-PLLuM-8B-chat":
    <<: *generic_base_cpu

  "CYFRAGOVPL/Llama-PLLuM-8B-instruct":
    <<: *generic_base_cpu

  "CYFRAGOVPL/PLLuM-12B-chat":
    <<: *generic_base_cpu
    # PLLuM-12B has no chat_template in tokenizer_config.json — vLLM would use a broken fallback.
    # Passthrough to raw ###Pytanie:/###Odpowiedź: format matches training distribution.
    modelChatTemplate: |
      {%- for message in messages -%}
      {{ message['content'] }}{% if not loop.last %}
      {% endif %}
      {%- endfor -%}

  "CYFRAGOVPL/PLLuM-12B-instruct":
    <<: *generic_base_cpu
    # Same rationale as PLLuM-12B-chat above.
    modelChatTemplate: |
      {%- for message in messages -%}
      {{ message['content'] }}{% if not loop.last %}
      {% endif %}
      {%- endfor -%}

  "speakleash/Bielik-1.5B-v3.0-Instruct":
    <<: *generic_base_cpu

  "speakleash/Bielik-4.5B-v3.0-Instruct":
    <<: *generic_base_cpu

  "speakleash/Bielik-11B-v3.0-Instruct":
    <<: *generic_base_cpu

# Default arguments if the model ID is not found
defaultModelConfigs:
  configMapValues:
    OMPI_MCA_btl_vader_single_copy_mechanism: none
    VLLM_BLOCK_SIZE: "128"
    VLLM_MAX_NUM_BATCHED_TOKENS: "2048"
    VLLM_DATA_PARALLEL_SIZE: "1"
    VLLM_MAX_NUM_SEQS: "256"
    VLLM_DTYPE: "bfloat16"
    VLLM_TP_SIZE: "1"
    VLLM_PP_SIZE: "1"
    VLLM_RPC_TIMEOUT: "100000"
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    VLLM_ENGINE_ITERATION_TIMEOUT_S: "120"
    VLLM_CPU_SGL_KERNEL: "1"
    VLLM_CPU_KVCACHE_SPACE: "10"
  extraCmdArgs: ["--block-size", "128", "--dtype", "bfloat16", "--max-model-len", "5196"]
  modelChatTemplate: ""     # default is empty
  tensor_parallel_size: "1" # not applied on CPU
