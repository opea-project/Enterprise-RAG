# resources-reference-xpu.yaml is a file that contains the resource requests and limits for each microservice in the microservices-connector deployment.

services:
  text-extractor-usvc:
    replicas: 2
    resources:
      requests:
        cpu: 4
        memory: 2Gi
      limits:
        cpu: 8
        memory: 12Gi
  text-compression-usvc:
    replicas: 1
    resources:
      requests:
        cpu: 0.5
        memory: 64Mi
      limits:
        cpu: 2
        memory: 1Gi
  text-splitter-usvc:
    replicas: 1
    resources:
      requests:
        cpu: 1
        memory: 1Gi
      limits:
        cpu: 4
        memory: 2Gi
  docsum-usvc:
    replicas: 1
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 4
        memory: 4Gi
  llm-usvc:
    replicas: 2
    resources:
      requests:
        cpu: 200m
        memory: 200Mi
      limits:
        cpu: 1
        memory: 1Gi
  vllm_xpu:
    replicas: 1
    # Note: For vllm_xpu, GPU memory requirements are defined in deployment/pipelines/chatqa/resources-model-xpu.yaml
    hpa:
      minReplicas: 1
      maxReplicas: 4
      targetValue: 40m
      # average processing time of single token
      # 1/target value would mean tokens/sec
      # depends on used LLM model
      # metric used for scaling 'sum(rate(vllm:time_per_output_token_seconds_sum{service="vllm-xpu-svc"}[1m])) by (<<.GroupBy>>) / (0.001 + sum(rate(vllm:time_per_output_token_seconds_count{service="vllm-xpu-svc"}[1m])) by (<<.GroupBy>>))'
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 180
          policies:
          - type: Percent
            value: 25
            periodSeconds: 90
        scaleUp:
          selectPolicy: Max
          stabilizationWindowSeconds: 0
          policies:
          - type: Pods
            value: 1
            periodSeconds: 150
