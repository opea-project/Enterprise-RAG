---
- name: Set override_values.yaml path
  ansible.builtin.set_fact:
    apisix_helm_override_values_path: "{{ log_dir }}/{{ apisix.helm.chart_name }}-override-values.yaml"
    apisix_routes_helm_override_values_path: "{{ log_dir }}/{{ apisix_routes.helm.chart_name }}-override-values.yaml"
  tags:
    - install

- name: Ensure Helm repository is added
  kubernetes.core.helm_repository:
    name: "{{ apisix.helm.repo_name }}"
    repo_url: "{{ apisix.helm.repo_url }}"
    state: present
  register: helm_repo_add_result
  until: helm_repo_add_result is succeeded
  retries: 3
  delay: 15
  tags:
    - install
    - pre-upgrade

- name: Build Helm chart dependencies
  ansible.builtin.command:
    cmd: helm dependency build
    chdir: "{{ apisix.helm.chart_directory }}"
  register: helm_repo_add_result
  until: helm_repo_add_result is succeeded
  retries: 5
  delay: 15
  tags:
    - install
    - pre-upgrade

- name: Extract APISIX CRDs from subchart
  ansible.builtin.shell:
    cmd: >
      tar xzf {{ apisix.helm.chart_directory }}/charts/apisix-*.tgz
      -C {{ tmp_dir }}
      apisix/charts/apisix-ingress-controller/crds/apisixic-crds.yaml
  tags:
    - install
    - pre-upgrade

- name: Apply APISIX CRDs
  kubernetes.core.k8s:
    state: present
    src: "{{ tmp_dir }}/apisix/charts/apisix-ingress-controller/crds/apisixic-crds.yaml"
  tags:
    - install
    - pre-upgrade

- name: Ensure namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ apisix.namespace }}"
  tags:
    - install

- name: Enforce PSS
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ apisix.namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "privileged"
  when: enforcePSS
  tags:
    - install

- name: Run pre-upgrade checks
  ansible.builtin.include_role:
    name: upgrade
  vars:
    release_namespace: "{{ apisix.namespace }}"
    release_name: "{{ apisix.helm.release_name }}"
    release_enabled: "{{ apisix.enabled }}"
    chart_ref: "{{ apisix.helm.chart_directory }}"
    release_values_files: "{{ apisix.helm.default_values_file }}"
  tags:
    - pre-upgrade

- name: Get existing APISIX IngressClass
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: IngressClass
    name: apisix
  register: _apisix_ingressclass_info
  failed_when: false
  tags:
    - install
    - pre-upgrade

- name: Remove APISIX IngressClass if controller field changed (immutable field)
  kubernetes.core.k8s:
    api_version: networking.k8s.io/v1
    kind: IngressClass
    name: apisix
    state: absent
  when:
    - _apisix_ingressclass_info.resources | default([]) | length > 0
    - "'apisix-ingress-controller' not in (_apisix_ingressclass_info.resources[0].spec.controller | default(''))"
  tags:
    - install
    - pre-upgrade

- name: Install or Upgrade Helm chart
  kubernetes.core.helm:
    name: "{{ apisix.helm.release_name }}"
    chart_ref: "{{ apisix.helm.chart_directory }}"
    namespace: "{{ apisix.namespace }}"
    values_files: "{{ apisix.helm.default_values_file }}"
    state: present
    create_namespace: true
    wait: true
    timeout: "{{ helm_timeout }}"
    force: true
  register: helm_repo_install_result
  retries: 5
  delay: 15
  until: helm_repo_install_result.status is defined and helm_repo_install_result.status.status == "deployed"
  failed_when: helm_repo_install_result.status is not defined or helm_repo_install_result.status.status != "deployed"
  tags:
    - install

- name: Uninstall Helm chart
  kubernetes.core.helm:
    name: "{{ apisix.helm.release_name }}"
    namespace: "{{ apisix.namespace }}"
    state: absent
    wait: true
    wait_timeout: "300s"
  tags:
    - uninstall

- name: Delete namespace
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ apisix.namespace }}"
  tags:
    - uninstall
