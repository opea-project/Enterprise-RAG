---
- name: Check Keycloak data consistency
  tags:
    - pre-upgrade
    - data-consistency
  block:
    - name: Get Keycloak deployment name
      kubernetes.core.k8s_info:
        kind: StatefulSet
        namespace: "{{ keycloak.namespace }}"
        label_selectors:
          - app.kubernetes.io/name=keycloakx
      register: keycloak_deployment

    - name: Get Keycloak pod
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ keycloak.namespace }}"
        label_selectors:
          - app.kubernetes.io/name=keycloakx
      register: keycloak_pods

    - name: Set Keycloak pod and deployment facts
      ansible.builtin.set_fact:
        keycloak_pod: "{{ keycloak_pods.resources[0].metadata.name }}"
        keycloak_deployment_name: "{{ keycloak_deployment.resources[0].metadata.name if keycloak_deployment.resources else 'keycloak' }}"
        keycloak_realm: "{{ keycloak.realm | default('EnterpriseRAG') }}"
      when: keycloak_pods.resources | length > 0

    - name: Query Keycloak via kcadm.sh
      no_log: "{{ secure_logs }}"
      block:
        - name: Get Keycloak admin password from secret
          kubernetes.core.k8s_info:
            kind: Secret
            name: "{{ keycloak.auth.admin.password_secret_name }}"
            namespace: "{{ keycloak.namespace }}"
          register: keycloak_secret

        - name: Decode Keycloak admin password
          ansible.builtin.set_fact:
            keycloak_admin_password: "{{ keycloak_secret.resources[0].data['admin-password'] | b64decode }}"
          when: keycloak_secret.resources | length > 0

        - name: Query Keycloak resource counts via kcadm.sh
          kubernetes.core.k8s_exec:
            namespace: "{{ keycloak.namespace }}"
            pod: "{{ keycloak_pod }}"
            command: >
              bash -c 'KCPASS=$(echo {{ keycloak_admin_password | b64encode }} | base64 -d);
              /opt/keycloak/bin/kcadm.sh get {{ item }}
              --no-config
              --server http://localhost:8080{{ keycloak.pathPrefix | default("") }}
              --realm master
              --user {{ keycloak.auth.admin.username }}
              --password "$KCPASS"
              --target-realm {{ keycloak_realm }}
              --fields id --limit 2147483647 2>/dev/null | grep -c "\"id\"" || true'
          loop:
            - users
            - roles
            - clients
            - groups
          register: keycloak_query_results
          when:
            - keycloak_pod is defined
            - keycloak_admin_password is defined
            - keycloak_port_forward_ready | default(false)

    - name: Parse Keycloak counts
      ansible.builtin.set_fact:
        keycloak_users_count: "{{ (keycloak_query_results.results | selectattr('item', 'equalto', 'users') | first).stdout | trim }}"
        keycloak_roles_count: "{{ (keycloak_query_results.results | selectattr('item', 'equalto', 'roles') | first).stdout | trim }}"
        keycloak_clients_count: "{{ (keycloak_query_results.results | selectattr('item', 'equalto', 'clients') | first).stdout | trim }}"
        keycloak_groups_count: "{{ (keycloak_query_results.results | selectattr('item', 'equalto', 'groups') | first).stdout | trim }}"
      when:
        - keycloak_pod is defined
        - keycloak_query_results is defined
        - keycloak_query_results.results | selectattr('stdout', 'defined') | list | length > 0

    - name: Save Keycloak data to facts for YAML report
      ansible.builtin.set_fact:
        keycloak_report_data:
          component: "{{ keycloak_deployment_name }}"
          users_count: "{{ keycloak_users_count | int }}"
          roles_count: "{{ keycloak_roles_count | int }}"
          clients_count: "{{ keycloak_clients_count | int }}"
          groups_count: "{{ keycloak_groups_count | int }}"
      when:
        - keycloak_pod is defined
        - keycloak_users_count is defined
