---
- name: Deployment version check
  tags:
    - install
    - pre-upgrade
  block:
    - name: Build kubeconfig candidate list for deployment manifest tasks
      ansible.builtin.set_fact:
        deployment_manifest_kubeconfig_candidates: >-
          {{
            (
              [
                kubeconfig | default(''),
                lookup('ansible.builtin.env', 'KUBECONFIG') | default(''),
                (ansible_env.HOME | default('')) ~ '/.kube/config'
              ]
              +
              ([inventory_dir ~ '/artifacts/admin.conf']
               if (inventory_dir is defined and (inventory_dir | length > 0))
               else [])
              +
              ([playbook_dir ~ '/../inventory/localhost/artifacts/admin.conf']
               if (playbook_dir is defined and (playbook_dir | length > 0))
               else [])
            )
            | reject('equalto', '')
            | unique
            | list
          }}

    - name: Probe kubeconfig candidates
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ deployment_manifest_kubeconfig_candidates }}"
      register: deployment_manifest_kubeconfig_probe
      failed_when: false

    - name: Resolve kubeconfig path for deployment manifest tasks
      ansible.builtin.set_fact:
        deployment_manifest_kubeconfig: >-
          {{
            (
              deployment_manifest_kubeconfig_probe.results
              | selectattr('stat', 'defined')
              | selectattr('stat.exists', 'defined')
              | selectattr('stat.exists', 'equalto', true)
              | map(attribute='item')
              | list
              | first
            ) | default('')
          }}

    - name: Fail when no usable kubeconfig is found for deployment manifest tasks
      ansible.builtin.fail:
        msg: >-
          No usable kubeconfig found for deployment manifest tasks.
          Checked candidates: {{ deployment_manifest_kubeconfig_candidates | join(', ') }}
      when: deployment_manifest_kubeconfig | length == 0

    - name: Check for existing deployment manifest
      kubernetes.core.k8s_info:
        kind: ConfigMap
        namespace: "{{ manifest_namespace }}"
        label_selectors:
          - "{{ manifest_label_selector }}"
      register: existing_manifests
      failed_when: false

    - name: Ensure manifest lookup has default empty resources list
      set_fact:
        existing_manifests: "{{ existing_manifests | combine({'resources': []}, recursive=True) }}"
      when: existing_manifests.resources is not defined

    - name: Parse existing deployment manifest
      set_fact:
        existing_deployment: "{{ ((existing_manifests.resources | default([]))[0].data['manifest.yaml'] | from_yaml) if (existing_manifests.resources | default([]) | length) > 0 else {} }}"
        manifest_exists: "{{ (existing_manifests.resources | default([]) | length) > 0 }}"

    - name: Fresh install detected
      debug:
        msg: "No deployment manifest found - fresh install ({{ solution_version }})"
      when: not manifest_exists

    - name: Force install mode active
      debug:
        msg: "Force install mode - bypassing version checks (target: {{ solution_version }})"
      when: force_install_mode | default(false) | bool

    - name: Check deployment status
      set_fact:
        is_in_progress: "{{ existing_deployment.deployment.status | default('complete') == manifest_status_in_progress }}"
        is_deleting: "{{ existing_deployment.deployment.status | default('') == manifest_status_deleting }}"
      when: manifest_exists

    - name: Block install over active uninstall
      fail:
        msg: |
          Deployment is being uninstalled ({{ existing_deployment.deployment.version }}).
          Wait for uninstall to complete or use force_install_mode=true.
      when:
        - is_deleting | default(false) | bool
        - not (force_install_mode | default(false) | bool)

    - name: Warn about installing over active uninstall (force mode)
      debug:
        msg: "WARNING: Installing over active uninstall of {{ existing_deployment.deployment.version }} (force mode)"
      when:
        - is_deleting | default(false) | bool
        - force_install_mode | default(false) | bool

    - name: Check in-progress target version
      set_fact:
        target_version_match: "{{ existing_deployment.deployment.targetVersion | default('') == solution_version }}"
        has_target_version: "{{ existing_deployment.deployment.targetVersion is not none and existing_deployment.deployment.targetVersion != '' }}"
      when: is_in_progress | default(false) | bool

    - name: Resuming incomplete deployment
      debug:
        msg: "Resuming: {{ existing_deployment.deployment.version | default('unknown') }} -> {{ existing_deployment.deployment.targetVersion | default('unknown') }}"
      when:
        - is_in_progress | default(false) | bool
        - target_version_match | default(false) | bool

    - name: Block incomplete deployment with version mismatch
      fail:
        msg: |
          Incomplete deployment of different version:
            In-progress target: {{ existing_deployment.deployment.targetVersion | default('unknown') }}
            Attempting to install: {{ solution_version }}
          Use force_install_mode=true to override.
      when:
        - is_in_progress | default(false) | bool
        - has_target_version | default(false) | bool
        - not (target_version_match | default(false) | bool)
        - not (force_install_mode | default(false) | bool)

    - name: Warn about version mismatch override (force mode)
      debug:
        msg: "WARNING: Overriding incomplete deployment {{ existing_deployment.deployment.version }} with {{ solution_version }} (force mode)"
      when:
        - is_in_progress | default(false) | bool
        - not (target_version_match | default(false) | bool)
        - force_install_mode | default(false) | bool

    - name: Compare deployed vs installing version
      ansible.builtin.script:
        cmd: "{{ role_path }}/files/compare_versions.py"
      environment:
        DEPLOYED_VERSION: "{{ existing_deployment.deployment.version }}"
        INSTALLING_VERSION: "{{ solution_version }}"
      register: version_comparison
      changed_when: false
      when:
        - manifest_exists
        - not (is_in_progress | default(false) | bool)

    - name: Parse version comparison
      set_fact:
        install_mode: "{{ (version_comparison.stdout | from_json).mode }}"
        deployed_ver: "{{ (version_comparison.stdout | from_json).deployed_version }}"
        installing_ver: "{{ (version_comparison.stdout | from_json).installing_version }}"
      when: manifest_exists and not (is_in_progress | default(false) | bool)

    - name: Display detected mode
      debug:
        msg: "Mode: {{ install_mode | upper }} ({{ deployed_ver }} -> {{ installing_ver }})"
      when:
        - manifest_exists
        - install_mode is defined

    - name: Set upgrade mode flag
      set_fact:
        is_upgrade_mode: "{{ install_mode in ['major_upgrade', 'minor_upgrade', 'patch_upgrade'] }}"
      when:
        - manifest_exists
        - install_mode is defined

    - name: Check upgrade constraint
      when:
        - manifest_exists
        - is_upgrade_mode | default(false) | bool
      block:
        - name: Load upgrade_base_version from version.yaml
          set_fact:
            upgrade_base_version_required: "{{ upgrade_base_version | default('') }}"

        - name: No upgrade constraint configured
          debug:
            msg: "No upgrade_base_version constraint - allowing upgrade from any version"
          when: upgrade_base_version_required | length == 0

        - name: Block unsupported upgrade
          fail:
            msg: |
              Upgrade not supported: {{ deployed_ver }} -> {{ installing_ver }}
              Version {{ installing_ver }} does not support upgrades.
              Backup, clean install, and restore instead.
          when:
            - upgrade_base_version_required | length > 0
            - upgrade_base_version_required == 'unsupported'
            - not (force_install_mode | default(false) | bool)

        - name: Warn about forced unsupported upgrade
          debug:
            msg: "WARNING: Forcing install despite upgrade marked unsupported ({{ deployed_ver }} -> {{ installing_ver }})"
          when:
            - upgrade_base_version_required | length > 0
            - upgrade_base_version_required == 'unsupported'
            - force_install_mode | default(false) | bool

        - name: Verify upgrade constraint
          when:
            - upgrade_base_version_required | length > 0
            - upgrade_base_version_required != 'unsupported'
          block:
            - name: Check deployed version against upgrade constraint
              ansible.builtin.script:
                cmd: "{{ role_path }}/files/compare_versions.py"
              environment:
                SOURCE_VERSION: "{{ deployed_ver }}"
                TARGET_VERSION: "{{ installing_ver }}"
                UPGRADE_CONSTRAINT: "{{ upgrade_base_version_required }}"
              register: constraint_check_result
              changed_when: false
              failed_when: false

            - name: Parse constraint check
              set_fact:
                upgrade_constraint_check: "{{ constraint_check_result.stdout | from_json }}"

            - name: Block upgrade on constraint violation
              fail:
                msg: |
                  Unsupported upgrade path: {{ deployed_ver }} -> {{ installing_ver }}
                  Constraint: {{ upgrade_base_version_required }}
                  {{ upgrade_constraint_check.reason }}
                  Check upgrade docs for supported paths.
              when: not (upgrade_constraint_check.allowed | default(false))

            - name: Constraint check passed
              debug:
                msg: "Constraint check: {{ deployed_ver }} satisfies {{ upgrade_base_version_required }} -> {{ installing_ver }}"

    - name: Display install mode
      debug:
        msg: "{{ install_mode | replace('_', ' ') | capitalize }}: {{ deployed_ver }} -> {{ installing_ver }}"
      when:
        - manifest_exists
        - install_mode is defined
        - install_mode != "downgrade"

    - name: Block downgrade
      fail:
        msg: |
          Downgrade blocked: {{ deployed_ver }} -> {{ installing_ver }}
          Use force_install_mode=true to bypass, or clean install + restore from backup.
      when:
        - manifest_exists
        - install_mode is defined
        - install_mode == "downgrade"
        - not (force_install_mode | default(false) | bool)

    - name: Warn about forced downgrade
      debug:
        msg: "WARNING: Downgrade {{ deployed_ver }} -> {{ installing_ver }} (force mode - may cause data loss)"
      when:
        - manifest_exists
        - install_mode is defined
        - install_mode == "downgrade"
        - force_install_mode | default(false) | bool
