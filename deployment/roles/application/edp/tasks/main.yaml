---
- name: Set roles facts
  ansible.builtin.set_fact:
    edp_helm_override_values_path: "{{ tmp_dir }}/{{ edp.helm.chart_name }}-override-values.yaml"
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Build Helm chart dependencies
  ansible.builtin.command:
    cmd: helm dependency build
    chdir: "{{ edp.helm.chart_directory }}"
  register: helm_repo_add_result
  until: helm_repo_add_result is succeeded
  retries: 5
  delay: 15
  tags:
    - install
    - pre-upgrade

- name: Ensure namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ edp.namespace }}"
  tags:
    - install

- name: Enforce PSS
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ edp.namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "restricted"
  when: enforcePSS
  tags:
    - install

- name: Create TLS secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ edp.tls.secret_name }}"
        namespace: "{{ edp.namespace }}"
      data:
        tls.crt: "{{ lookup('file', pathToCert) | b64encode }}"
        tls.key: "{{ lookup('file', pathToKey) | b64encode }}"
      type: kubernetes.io/tls
  tags:
    - install

# Creates chatqa_namespace
- name: Get chatqa namespace
  ansible.builtin.include_role:
    name: utils
    tasks_from: get_chatqa_namespace.yaml
  tags:
    - install
    - update-configuration

# Creates keycloak-minio-secret with client-secret key directly in edp namespace
- name: Retrieve minio OIDC client secret from Keycloak
  block:
    - name: Get client_secret_id keycloak
      vars:
        get_secret_client_id: "{{ edp.client_id }}"
        get_secret_ns: "{{ edp.namespace }}"
        get_secret_secret_name: "keycloak-minio-secret"
      ansible.builtin.include_role:
        name: keycloak
        tasks_from: get_secret_id
        apply:
          tags:
            - pre-upgrade
            - update-configuration

    - name: Set secret client_secret_id
      ansible.builtin.set_fact:
        edp_client_secret_id: "{{ client_secret_id.stdout }}"
      no_log: "{{ secure_logs }}"
  rescue:
    - name: Handle missing minio OIDC client during upgrade
      ansible.builtin.debug:
        msg: >-
          Keycloak client '{{ edp.client_id }}' not found - expected when upgrading from
          a version that did not include the minio OIDC client. The client will be created
          during the install phase by the keycloak configurator.
      when: "'pre-upgrade' in ansible_run_tags"

    - name: Set placeholder client secret for pre-upgrade metadata check
      ansible.builtin.set_fact:
        edp_client_secret_id: "placeholder-will-be-set-during-install"
      when: "'pre-upgrade' in ansible_run_tags"

    - name: Fail on missing client secret during install
      ansible.builtin.fail:
        msg: "Failed to retrieve client secret for '{{ edp.client_id }}'. The keycloak configurator should have created this client."
      when: "'pre-upgrade' not in ansible_run_tags"
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Generate random string for keys
  ansible.builtin.include_role:
    name: generate_password
    tasks_from: generate_key
    apply:
      tags:
        - pre-upgrade
        - update-configuration
  loop:
    - { name: EDP_MINIO_ACCESS_KEY }
    - { name: EDP_MINIO_SECRET_KEY }
  no_log: "{{ secure_logs }}"
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Generate password
  ansible.builtin.include_role:
    name: generate_password
    tasks_from: generate_password
    apply:
      tags:
        - pre-upgrade
        - update-configuration
  loop:
    - { name: EDP_REDIS, user: "{{ edp.redis.auth.user.db_username }}" }
    - { name: EDP_POSTGRESQL, user: "{{ edp.postgresql.auth.user.db_username }}" }
    - { name: EDP_POSTGRESQL_ADMIN, user: "{{ edp.postgresql.auth.admin.db_username }}" }
  no_log: "{{ secure_logs }}"
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Generate override values file from template
  ansible.builtin.template:
    src: "values.yaml.j2"
    dest: "{{ edp_helm_override_values_path }}"
    mode: '0644'
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Set values_files list
  ansible.builtin.set_fact:
    values_files: >
      {{
        [edp.helm.default_values_file] +
        [edp_helm_override_values_path]
      }}
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Run pre-upgrade checks
  ansible.builtin.include_role:
    name: upgrade
  vars:
    release_namespace: "{{ edp.namespace }}"
    release_name: "{{ edp.helm.release_name }}"
    release_enabled: "{{ edp.enabled }}"
    chart_ref: "{{ edp.helm.chart_directory }}"
    release_values_files: "{{ values_files }}"
  tags:
    - pre-upgrade

- name: Include SeaweedFS tasks
  ansible.builtin.include_tasks:
    file: seaweedfs.yaml
  when: edp.storageType == 'seaweedfs'
  tags:
    - install
    - pre-upgrade
    - uninstall
    - delete

- name: Check ChatQA embedding deployment readiness before EDP install
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ chatqa_namespace }}"
    name: embedding-svc-deployment
  register: chatqa_embedding_deployment
  until: >
    (chatqa_embedding_deployment.resources | length > 0)
    and
    ((chatqa_embedding_deployment.resources[0].status.availableReplicas | default(0) | int) > 0)
  retries: 20
  delay: 15
  failed_when: false
  changed_when: false
  when:
    - (edp | default({})).enabled | default(false)
    - (chatqa_pipelines | default([]) | length) > 0
  tags:
    - install
    - update-configuration

- name: Fail early when ChatQA embedding deployment is not ready
  ansible.builtin.fail:
    msg: >-
      EDP depends on ChatQA embedding service, but deployment 'embedding-svc-deployment'
      in namespace '{{ chatqa_namespace }}' is not ready (availableReplicas=0).
      Check pipeline model-server pods (torchserve/vllm embedding backends) in that namespace.
      Run: kubectl get pods -n {{ chatqa_namespace }} && kubectl get deploy -n {{ chatqa_namespace }}
  when:
    - (edp | default({})).enabled | default(false)
    - chatqa_embedding_deployment is defined
    - ((chatqa_embedding_deployment.resources | default([]) | length) == 0) or (((chatqa_embedding_deployment.resources | default([]) | first | default({})).status | default({})).availableReplicas | default(0) | int == 0)
    - (chatqa_pipelines | default([]) | length) > 0
  tags:
    - install
    - update-configuration

- name: Install or Upgrade Helm chart
  kubernetes.core.helm:
    name: "{{ edp.helm.release_name }}"
    chart_ref: "{{ edp.helm.chart_directory }}"
    namespace: "{{ edp.namespace }}"
    values_files: "{{ values_files }}"
    state: present
    dependency_update: true
    create_namespace: true
    timeout: "{{ helm_timeout }}"
    wait: true
  register: helm_repo_install_result
  until: helm_repo_install_result is succeeded
  retries: 5
  delay: 15
  tags:
    - install
    - update-configuration

- name: Backfill embedding_model column for existing files
  block:
    - name: Check for embedding model migration status
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: embedding-model-migration-status
        namespace: "{{ chatqa_namespace }}"
      register: migration_status_configmap
      failed_when: false

    - name: Set migration active flag
      ansible.builtin.set_fact:
        migration_in_progress: "{{ migration_status_configmap.resources | length > 0 and migration_status_configmap.resources[0].data.migration_required | default('false') == 'true' }}"

    - name: Get old model from migration ConfigMap
      ansible.builtin.set_fact:
        migration_old_model: "{{ migration_status_configmap.resources[0].data.old_model | default('') }}"
      when:
        - migration_in_progress | bool
        - migration_status_configmap.resources | length > 0

    - name: Skip backfill during migration
      ansible.builtin.debug:
        msg: |
          Skipping embedding_model backfill - migration in progress.
          Pre-upgrade documents with NULL embedding_model will be flagged in UI for re-ingestion.
          Old model: {{ migration_old_model | default('unknown') }}
      when: migration_in_progress | bool

    - name: Perform backfill when no migration is active
      when: not (migration_in_progress | bool)
      block:
        - name: Get current embedding model from ConfigMap
          kubernetes.core.k8s_info:
            api_version: v1
            kind: ConfigMap
            name: embedding-usvc-config
            namespace: "{{ chatqa_namespace }}"
          register: embedding_configmap
          failed_when: false

        - name: Set embedding model name from ConfigMap
          ansible.builtin.set_fact:
            current_embedding_model: "{{ embedding_configmap.resources[0].data.EMBEDDING_MODEL_NAME }}"
          when: embedding_configmap.resources | length > 0

        - name: Validate embedding model format
          ansible.builtin.assert:
            that:
              - current_embedding_model is match('^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)?$')
            fail_msg: >-
              Refusing to backfill - embedding model name '{{ current_embedding_model }}'
              does not match the expected pattern (alphanumerics, '.', '_', '-' with an
              optional single '/' segment).
          when:
            - current_embedding_model is defined
            - current_embedding_model | length > 0

        - name: Backfill embedding_model for existing files with NULL values
          kubernetes.core.k8s_exec:
            namespace: "{{ edp.namespace }}"
            pod: "edp-postgresql-0"
            command: >
              psql -U {{ edp.postgresql.auth.user.db_username }}
              -d {{ edp.postgresql.auth.user.db_name }}
              -v ON_ERROR_STOP=1
              -v model={{ current_embedding_model }}
              -c "UPDATE files SET embedding_model = :'model'
              WHERE embedding_model IS NULL AND status = 'ingested';"
          when:
            - embedding_configmap.resources | length > 0
            - current_embedding_model is defined
            - current_embedding_model | length > 0
          register: backfill_result

        - name: Backfill embedding_model for existing links with NULL values
          kubernetes.core.k8s_exec:
            namespace: "{{ edp.namespace }}"
            pod: "edp-postgresql-0"
            command: >
              psql -U {{ edp.postgresql.auth.user.db_username }}
              -d {{ edp.postgresql.auth.user.db_name }}
              -v ON_ERROR_STOP=1
              -v model={{ current_embedding_model }}
              -c "UPDATE links SET embedding_model = :'model'
              WHERE embedding_model IS NULL AND status = 'ingested';"
          when:
            - embedding_configmap.resources | length > 0
            - current_embedding_model is defined
            - current_embedding_model | length > 0

        - name: Display backfill result
          ansible.builtin.debug:
            msg: "Backfilled embedding_model column for existing files and links with: {{ current_embedding_model }}"
          when:
            - current_embedding_model is defined
            - current_embedding_model | length > 0
  rescue:
    - name: Handle backfill failure
      ansible.builtin.debug:
        msg: "Failed to backfill embedding_model column - this is expected for fresh installations"
  tags:
    - install
    - update-configuration

- name: Mark secrets for password management
  ansible.builtin.include_role:
    name: password_mgmt
    tasks_from: markup.yaml
    apply:
      tags:
        - install
        - update-configuration
  vars:
    namespace: "{{ edp.namespace }}"
    secret_name: "{{ item.secret_name }}"
    password_mappings: "{{ item.password_mappings }}"
  loop:
    - secret_name: "edp-access-secret"
      password_mappings:
        - { key: EDP_ACCESS_KEY, variable: EDP_MINIO_ACCESS_KEY, user: "" }
        - { key: EDP_SECRET_KEY, variable: EDP_MINIO_SECRET_KEY, user: "" }
    - secret_name: "edp-redis-secret"
      password_mappings:
        - { key: password, variable: EDP_REDIS_PASSWORD, user: "{{ edp.redis.auth.user.db_username }}" }
    - secret_name: "edp-postgresql-secret"
      password_mappings:
        - { key: DATABASE_PASSWORD, variable: EDP_POSTGRESQL_PASSWORD, user: "{{ edp.postgresql.auth.user.db_username }}" }
        - { key: DATABASE_ADMIN_PASSWORD, variable: EDP_POSTGRESQL_ADMIN_PASSWORD, user: "{{ edp.postgresql.auth.admin.db_username }}" }
  tags:
    - install
    - update-configuration

# UNINSTALL TASKS
- name: Uninstall EDP Helm release
  kubernetes.core.helm:
    name: "{{ edp.helm.release_name }}"
    namespace: "{{ edp.namespace }}"
    state: absent
    wait: true
    wait_timeout: "300s"
  when: (edp | default({})).enabled | default(false) or "delete" in ansible_run_tags
  tags:
    - uninstall
    - delete

- name: Delete EDP namespace
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ edp.namespace }}"
  when: (edp | default({})).enabled | default(false) or "delete" in ansible_run_tags
  tags:
    - uninstall
    - delete
