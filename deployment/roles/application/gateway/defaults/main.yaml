---
gateway:
  enabled: true
  namespace: "erag-gateway"
  serviceType: "ClusterIP"     # ClusterIP when using hostPort; LoadBalancer when using MetalLB/cloud LB
  externalTrafficPolicy: "Cluster"  # Local preserves client source IP and works correctly behind stateful firewalls/VPNs
  hostPort:
    enabled: true              # bare-metal: bind :80/:443 directly on the node; set false when using LoadBalancer
    httpPort: 80
    httpsPort: 443
  listenerTuning:
    enabled: true
    listenerFiltersTimeout: "30s"
    continueOnTimeout: true
    initialReadBufferSize: 65535
  helm:
    chart_name: "erag-gateway"
    chart_directory: "{{ playbook_dir }}/../components/gateway"
    release_name: "erag-gateway"
    default_values_file: "{{ playbook_dir }}/../components/gateway/values.yaml"

routing_mode: "subdomain"
