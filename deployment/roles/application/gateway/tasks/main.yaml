# Gateway API role — replaces the legacy ingress-nginx role.
# Deploys Gateway + HTTPRoutes via the components/gateway Helm chart.
# Istio auto-provisions the proxy Deployment + Service; a post-install
# Helm hook patches the deployment with hostPort for bare-metal nodes.

---
- name: Set override_values.yaml path
  ansible.builtin.set_fact:
    gateway_helm_override_values_path: "{{ tmp_dir }}/{{ gateway.helm.chart_name }}-override-values.yaml"
  tags:
    - install
    - pre-upgrade

- name: Generate override values file from template
  ansible.builtin.template:
    src: "values.yaml.j2"
    dest: "{{ gateway_helm_override_values_path }}"
    mode: '0644'
  tags:
    - install
    - pre-upgrade

- name: Set values_files list
  ansible.builtin.set_fact:
    gateway_values_files: >
      {{
        [gateway.helm.default_values_file] +
        [gateway_helm_override_values_path]
      }}
  tags:
    - install
    - pre-upgrade

- name: Remove legacy ingress-nginx namespace (upgrade from pre-2.2.0)
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: ingress-nginx
  ignore_errors: true
  tags:
    - install

- name: Ensure namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gateway.namespace }}"
  tags:
    - install

- name: Enforce PSS
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gateway.namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "privileged"
  when: enforcePSS
  tags:
    - install

- name: Create TLS secret in gateway namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: tls-secret
        namespace: "{{ gateway.namespace }}"
      data:
        tls.crt: "{{ lookup('file', pathToCert) | b64encode }}"
        tls.key: "{{ lookup('file', pathToKey) | b64encode }}"
      type: kubernetes.io/tls
  tags:
    - install

- name: Run pre-upgrade checks
  ansible.builtin.include_role:
    name: upgrade
  vars:
    release_namespace: "{{ gateway.namespace }}"
    release_name: "{{ gateway.helm.release_name }}"
    release_enabled: "{{ gateway.enabled }}"
    chart_ref: "{{ gateway.helm.chart_directory }}"
    release_values_files: "{{ gateway_values_files }}"
  tags:
    - pre-upgrade

- name: Install or Upgrade Helm chart
  kubernetes.core.helm:
    name: "{{ gateway.helm.release_name }}"
    chart_ref: "{{ gateway.helm.chart_directory }}"
    namespace: "{{ gateway.namespace }}"
    values_files: "{{ gateway_values_files }}"
    state: present
    create_namespace: true
    wait: true
    timeout: "{{ helm_timeout }}"
  register: helm_gateway_install_result
  until: helm_gateway_install_result is succeeded
  retries: 5
  delay: 15
  tags:
    - install

- name: Wait for Istio auto-provisioned deployment
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ gateway.namespace }}"
    name: "{{ gateway.helm.release_name }}-istio"
  register: gateway_deploy
  until: gateway_deploy.resources | length > 0
  retries: 30
  delay: 5
  tags:
    - install

- name: Set reverse proxy storage port
  ansible.builtin.set_fact:
    _rps_port: "{{ reverse_proxy_storage_port | default(443) | int }}"
  when: reverse_proxy_storage | default(false) | bool
  tags:
    - install

- name: Create Endpoints for external storage backend
  kubernetes.core.k8s:
    state: present
    definition: |
      apiVersion: v1
      kind: Endpoints
      metadata:
        name: external-backend
        namespace: default
      subsets:
        - addresses:
            - ip: "{{ ontap_data_lif }}"
          ports:
            - name: https
              port: {{ _rps_port }}
              protocol: TCP
  when: reverse_proxy_storage | default(false) | bool
  tags:
    - install

- name: Create Service for external storage backend
  kubernetes.core.k8s:
    state: present
    definition: |
      apiVersion: v1
      kind: Service
      metadata:
        name: external-backend
        namespace: default
      spec:
        type: ClusterIP
        ports:
          - name: https
            port: {{ _rps_port }}
            targetPort: {{ _rps_port }}
        selector: {}
  when: reverse_proxy_storage | default(false) | bool
  tags:
    - install

- name: Create DestinationRule for external storage backend
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.istio.io/v1
      kind: DestinationRule
      metadata:
        name: external-backend-tls
        namespace: default
      spec:
        host: external-backend.default.svc.cluster.local
        trafficPolicy:
          connectionPool:
            http:
              h2UpgradePolicy: DO_NOT_UPGRADE
          tls:
            mode: SIMPLE
            insecureSkipVerify: true
  when: reverse_proxy_storage | default(false) | bool
  tags:
    - install

- name: Create ReferenceGrant for external storage backend
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1beta1
      kind: ReferenceGrant
      metadata:
        name: allow-gateway-refs
        namespace: default
      spec:
        from:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
            namespace: default
          - group: gateway.networking.k8s.io
            kind: Gateway
            namespace: "{{ gateway.namespace }}"
        to:
          - group: ""
            kind: Service
          - group: ""
            kind: Secret
  when: reverse_proxy_storage | default(false) | bool
  tags:
    - install

- name: Create HTTPRoute for external storage backend (subdomain mode)
  kubernetes.core.k8s:
    state: present
    definition: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: external-backend-route
        namespace: default
      spec:
        parentRefs:
          - name: {{ gateway.helm.release_name }}
            namespace: {{ gateway.namespace }}
            sectionName: https
        hostnames:
          - s3.{{ FQDN }}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: external-backend
                port: {{ _rps_port | int }}
  when:
    - reverse_proxy_storage | default(false) | bool
    - routing_mode | default('subdomain') != 'path'
  tags:
    - install

- name: Create HTTPRoute for external storage backend (path mode)
  kubernetes.core.k8s:
    state: present
    definition: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: external-backend-route
        namespace: default
      spec:
        parentRefs:
          - name: {{ gateway.helm.release_name }}
            namespace: {{ gateway.namespace }}
            sectionName: https
        hostnames:
          - {{ FQDN }}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: {{ edp.s3PathPrefix | default('/s3') }}
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /
            backendRefs:
              - name: external-backend
                port: {{ _rps_port | int }}
  when:
    - reverse_proxy_storage | default(false) | bool
    - routing_mode | default('subdomain') == 'path'
  tags:
    - install

- name: Uninstall Helm chart
  kubernetes.core.helm:
    name: "{{ gateway.helm.release_name }}"
    namespace: "{{ gateway.namespace }}"
    state: absent
  tags:
    - uninstall
    - delete

- name: Remove namespace
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gateway.namespace }}"
    state: absent
  tags:
    - uninstall
    - delete

- name: Remove reverse proxy storage resources
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: "{{ item.apiVersion }}"
      kind: "{{ item.kind }}"
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ item.namespace }}"
  loop:
    - { apiVersion: "gateway.networking.k8s.io/v1", kind: HTTPRoute, name: external-backend-route, namespace: default }
    - { apiVersion: "gateway.networking.k8s.io/v1beta1", kind: ReferenceGrant, name: allow-gateway-refs, namespace: default }
    - { apiVersion: "networking.istio.io/v1", kind: DestinationRule, name: external-backend-tls, namespace: default }
    - { apiVersion: v1, kind: Service, name: external-backend, namespace: default }
    - { apiVersion: v1, kind: Endpoints, name: external-backend, namespace: default }
  when: reverse_proxy_storage | default(false) | bool
  tags:
    - uninstall
    - delete
