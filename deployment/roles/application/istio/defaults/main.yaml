---
istio:
  enabled: true
  namespace: "istio-system"
  gateway_api:
    # Gateway API CRDs must be installed before istiod starts (required since Istio 1.22).
    # Version must be compatible with the Istio release (Istio 1.27.x → Gateway API v1.2.x).
    crds_version: "v1.2.1"
    crds_url: "https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml"
  helm:
    version: "{{ helm_version }}"
    repo_name: "istio"
    repo_url: "https://istio-release.storage.googleapis.com/charts"
    chart_name: "istio"
    chart_directory: "{{ playbook_dir }}/../components/istio"
    release_name: "istio"
    chart_version: "1.2.0"
    default_values_file: "{{ playbook_dir }}/../components/istio/values.yaml"
