---
# Job-based client secret retrieval - runs inside the cluster, no port-forward needed
# Parameters:
#   get_secret_client_id       - Keycloak client name (required)
#   get_secret_ns              - Target namespace where the K8s secret will be created (default: keycloak.namespace)
#   get_secret_secret_name     - Name of the K8s secret to create (default: keycloak-client-secret)
#   get_secret_key             - Key within the K8s secret (default: client-secret)

- name: Set init container image reference
  ansible.builtin.set_fact:
    init_container_image: "{{ registry if use_alternate_tagging else registry ~ '/erag-init-container' }}:{{ 'erag-init-container_' ~ tag if use_alternate_tagging else tag }}"
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Set get-secret variables
  ansible.builtin.set_fact:
    keycloak_namespace: "{{ keycloak.namespace }}"
    keycloak_admin_user: "{{ keycloak.auth.admin.username }}"
    keycloak_admin_secret_name: "{{ keycloak.auth.admin.password_secret_name }}"
    keycloak_path_prefix: "{{ keycloak.pathPrefix | default('') }}"
    keycloak_client_id: "{{ get_secret_client_id | default(keycloak.client_id) }}"
    get_secret_target_namespace: "{{ get_secret_ns | default(keycloak.namespace) }}"
    client_secret_name: "{{ get_secret_secret_name | default('keycloak-client-secret') }}"
    client_secret_key: "{{ get_secret_key | default('client-secret') }}"
    get_secret_job_name: "keycloak-get-secret-{{ (get_secret_client_id | default(keycloak.client_id)) | lower | regex_replace('[^a-z0-9]', '-') }}"
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Generate get-secret Job manifest
  ansible.builtin.template:
    src: get-secret-job.yaml.j2
    dest: "{{ tmp_dir }}/keycloak-get-secret-job.yaml"
    mode: '0600'
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Delete existing get-secret Job if present
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: "{{ get_secret_job_name }}"
    namespace: "{{ keycloak.namespace }}"
    wait: true
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Apply get-secret Job
  kubernetes.core.k8s:
    state: present
    src: "{{ tmp_dir }}/keycloak-get-secret-job.yaml"
    wait: false
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Wait for get-secret Job to complete
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    name: "{{ get_secret_job_name }}"
    namespace: "{{ keycloak.namespace }}"
  register: job_status
  until: >
    (job_status.resources | length > 0) and
    ((job_status.resources[0].status.succeeded is defined and job_status.resources[0].status.succeeded >= 1) or
    (job_status.resources[0].status.failed is defined and job_status.resources[0].status.failed >= 1))
  retries: 30
  delay: 5
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Check if get-secret Job succeeded
  ansible.builtin.fail:
    msg: "Get-secret Job failed. Check logs: kubectl logs -n {{ keycloak.namespace }} job/{{ get_secret_job_name }}"
  when: >
    job_status.resources[0].status.failed is defined and
    job_status.resources[0].status.failed >= 1
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Clean up get-secret Job
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: "{{ get_secret_job_name }}"
    namespace: "{{ keycloak.namespace }}"
    wait: false
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Get client secret from Kubernetes secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ client_secret_name }}"
    namespace: "{{ get_secret_target_namespace }}"
  register: client_secret_data
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Set client_secret_id fact
  ansible.builtin.set_fact:
    client_secret_id:
      stdout: "{{ client_secret_data.resources[0].data[client_secret_key] | b64decode }}"
  when: client_secret_data.resources | length > 0
  no_log: "{{ secure_logs }}"
  tags:
    - install
    - pre-upgrade
    - update-configuration


