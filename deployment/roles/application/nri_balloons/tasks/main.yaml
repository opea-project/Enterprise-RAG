---
- name: Ensure Helm repository is added
  kubernetes.core.helm_repository:
    name: "{{ balloons.helm.repo_name }}"
    repo_url: "{{ balloons.helm.repo_url }}"
    state: present
  environment:
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    ALL_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    all_proxy: ""
    NO_PROXY: "127.0.0.1,localhost,::1,10.233.0.1,10.80.55.45,.svc,.svc.cluster.local,.cluster.local"
    no_proxy: "127.0.0.1,localhost,::1,10.233.0.1,10.80.55.45,.svc,.svc.cluster.local,.cluster.local"
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Get all BalloonsPolicies
  kubernetes.core.k8s_info:
    api_version: config.nri/v1alpha1
    kind: BalloonsPolicy
    namespace: "{{ balloons.namespace }}"
  register: balloons_policies
  tags:
    - install
    - update-configuration

- name: Remove all BalloonsPolicies
  kubernetes.core.k8s:
    api_version: config.nri/v1alpha1
    kind: BalloonsPolicy
    name: "{{ item.metadata.name }}"
    namespace: "{{ balloons.namespace }}"
    state: absent
  loop: "{{ balloons_policies.resources }}"
  tags:
    - install
    - update-configuration

- name: Gather NUMA topology info
  ansible.builtin.include_role:
    name: utils
    tasks_from: verify_nodes_topology.yaml
    apply:
      tags:
        - pre-upgrade
  when: cpu_topology_per_node is not defined or optimal_replicas is not defined
  tags:
    - install
    - pre-upgrade
    - uninstall
    - topology-preview
    - update-configuration

- name: Ensure namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ balloons.namespace }}"
  when: balloons.namespace != 'kube-system'
  tags:
    - install
    - pre-upgrade

- name: Enforce PSS
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ balloons.namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "privileged"
  when:
    - enforcePSS
    - balloons.namespace != 'kube-system'
  tags:
    - install

- name: Run pre-upgrade checks
  ansible.builtin.include_role:
    name: upgrade
  vars:
    release_namespace: "{{ balloons.namespace }}"
    release_name: "{{ balloons.helm.release_name }}"
    release_enabled: "{{ balloons.enabled }}"
    chart_ref: "{{ balloons.helm.repo_name }}/{{ balloons.helm.chart_name }}"
    release_values_files: "{{ balloons.helm.reset_values_file }}"
  tags:
    - pre-upgrade

- name: Set balloons_chart_name fact for cross-role usage
  ansible.builtin.set_fact:
    balloons_chart_name: "{{ balloons.helm.chart_name }}"
  tags:
    - install
    - pre-upgrade
    - update-configuration

- name: Apply nri-resource-policy-balloons chart
  kubernetes.core.helm:
    name: "{{ balloons.helm.release_name }}"
    chart_ref: "{{ balloons.helm.repo_name }}/{{ balloons.helm.chart_name }}"
    namespace: "{{ balloons.namespace }}"
    chart_version: "{{ balloons.helm.chart_version }}"
    create_namespace: false
    values_files: "{{ balloons.helm.reset_values_file }}"
    state: present
    wait: true
    timeout: "{{ helm_timeout }}"
  environment:
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    ALL_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    all_proxy: ""
    NO_PROXY: "127.0.0.1,localhost,::1,10.233.0.1,10.80.55.45,.svc,.svc.cluster.local,.cluster.local"
    no_proxy: "127.0.0.1,localhost,::1,10.233.0.1,10.80.55.45,.svc,.svc.cluster.local,.cluster.local"
  register: helm_repo_add_result
  until: helm_repo_add_result is succeeded
  retries: 3
  delay: 15
  tags:
    - install
    - update-configuration

- name: Calculate maxReplicasGaudi_VLLM
  ansible.builtin.set_fact:
    maxReplicasGaudi_VLLM: >-
      {%- if item.type in ['chatqa', 'docsum'] and item.modelConfigPath is defined -%}
        {%- set model_config = (lookup('file', pipelines_dir + '/' + item.modelConfigPath) | from_yaml).get('modelConfigs', {}) -%}
        {%- set model_entry = model_config.get(llm_model_gaudi ~ '', {}) -%}
        {%- set tp_size = model_entry.get('tensor_parallel_size', none) -%}
        {%- if tp_size is not none and (tp_size | int) != 0 -%}
          {{ 8 // (tp_size | int) }}
        {%- else -%}
          {{ none }}
        {%- endif -%}
      {%- else -%}
        {{ none }}
      {%- endif -%}
  loop: "{{ pipelines }}"
  tags:
    - install
    - update-configuration

- name: Get limits from custom external containers
  ansible.builtin.include_tasks:
    file: custom_vllm.yaml
  vars:
    custom_balloons_restart: false
  when: >-
    (balloons.vllm_custom_name is defined and balloons.vllm_custom_name | length > 0) or
    (balloons.reranking_custom_name is defined and balloons.reranking_custom_name | length > 0) or
    (balloons.embedding_custom_name is defined and balloons.embedding_custom_name | length > 0)
  tags:
    - install
    - update-configuration

- name: Apply balloons/labels/taints for each node
  ansible.builtin.include_role:
    name: utils
    tasks_from: apply_scheduling_strategy.yaml
  loop: "{{ cpu_topology_per_node | dict2items }}"
  loop_control:
    loop_var: item
  when: cpu_topology_per_node is defined
  tags:
    - install
    - update-configuration

- name: Process custom external containers
  ansible.builtin.include_tasks:
    file: custom_vllm.yaml
  vars:
    custom_balloons_restart: true
  when: >-
    (balloons.vllm_custom_name is defined and balloons.vllm_custom_name | length > 0) or
    (balloons.reranking_custom_name is defined and balloons.reranking_custom_name | length > 0) or
    (balloons.embedding_custom_name is defined and balloons.embedding_custom_name | length > 0)
  tags:
    - install
    - update-configuration

- name: Uninstall NRI balloons policy
  ansible.builtin.include_tasks:
    file: uninstall.yaml
  tags:
    - uninstall
