---
telemetry:
  enabled: false
  domainName: grafana.erag.com
  # pathPrefix: set dynamically by solution_config.yaml when routing_mode == "path"
  # Default value used in path mode:
  defaultPathPrefix: "/grafana"
  prometheus:
    helm_repo: https://prometheus-community.github.io/helm-charts

  prometheus_adapter:
    values_file: "{{ playbook_dir }}/../components/hpa/prometheus_adapter.yaml"

  grafana:
    helm_repo: https://grafana.github.io/helm-charts
    tls:
      secret_name: "tls-secret"
    auth:
      admin:
        username: "admin"
        password_file_name: "grafana-password"
        password_secret_name: "grafana-password"

  opensearch:
    helm_repo: https://opensearch-project.github.io/helm-charts/

  opensearch_collector:
    helm_repo: https://open-telemetry.github.io/opentelemetry-helm-charts

  logging:
    enabled: true
    # Loki log retention policy.
    # When `enabled: true`, the installer turns on Loki's compactor-based
    # retention and sets `limits_config.retention_period: <hours>h`.
    # When `enabled: false`, retention is disabled and logs are kept forever
    # (matches the previous behaviour and the audit-friendly defaults shipped
    # in components/telemetry/helm/charts/logs/values.yaml).
    # Default `retentionHours: 744` (= 31 days) matches Loki's own built-in default
    # for `limits_config.retention_period`
    # (https://grafana.com/docs/loki/latest/configure/#limits_config).
    retention:
      enabled: true
      retentionHours: 744
    # PVC size for each MinIO drive backing Loki's chunks/ruler/admin buckets.
    # The chart enforces 2 drives per node (erasure code requirement), so the
    # raw object-store capacity available to Loki is roughly 2 * objectStoreSize.
    # Default 20Gi (upstream Loki chart ships 5Gi; bumped here to give 31-day
    # retention some headroom).
    objectStoreSize: 20Gi
    charts_path: "{{ playbook_dir }}/../components/telemetry/helm/charts/logs"
    helm_default_values_file: "{{ playbook_dir }}/../components/telemetry/helm/charts/logs/values.yaml"
    helm_journalctl_values_file: "{{ playbook_dir }}/../components/telemetry/helm/charts/logs/values-journalctl.yaml"

  traces:
    enabled: false  # Traces can be enabled/disabled independently from telemetry
    charts_path: "{{ playbook_dir }}/../components/telemetry/helm/charts/traces"
    helm_default_values_file: "{{ playbook_dir }}/../components/telemetry/helm/charts/traces/values.yaml"
    namespace: "monitoring-traces"

  traces_instr:
    charts_path: "{{ playbook_dir }}/../components/telemetry/helm/charts/traces-instr/"
    helm_default_values_file: "{{ playbook_dir }}/../components/telemetry/helm/charts/traces-instr/values.yaml"

  monitoring:
    charts_path: "{{ playbook_dir }}/../components/telemetry/helm/"
    helm_default_values_file: "{{ playbook_dir }}/../components/telemetry/helm/values.yaml"
    namespace: "monitoring"

  otelcol:
    delete_timeout: 10

hpaEnabled: false
