---
# Mitigation handler: verify_embedding_model_change
# Fires during --tags pre-upgrade when EMBEDDING_MODEL_NAME changes.
# Prompts the operator, records the decision, and creates the
# embedding-model-migration-status ConfigMap so --tags install can act on it.

- name: Check if migration decision was already made (re-run safety)
  kubernetes.core.k8s_info:
    kind: ConfigMap
    namespace: "{{ pipelines[0].namespace | default('chatqa') }}"
    name: embedding-model-migration-status
  register: existing_migration_cm
  failed_when: false

- name: Use existing decision if ConfigMap already present
  ansible.builtin.set_fact:
    embedding_model_user_decision: "{{ existing_migration_cm.resources[0].data.decision | default('use_new') }}"
    embedding_model_requires_reembedding: "{{ existing_migration_cm.resources[0].data.migration_required | default('true') | bool }}"
    migration_decision_already_recorded: true
  when: existing_migration_cm.resources | default([]) | length > 0

- name: Notify operator that prior decision is being reused
  ansible.builtin.debug:
    msg: |
      ========================================
      Embedding model migration decision already recorded.
      Decision: {{ embedding_model_user_decision }}
      Re-using existing decision — delete ConfigMap 'embedding-model-migration-status'
      in namespace '{{ pipelines[0].namespace | default('chatqa') }}' to reset.
      ========================================
  when: migration_decision_already_recorded | default(false) | bool

- name: Prompt operator for embedding model decision
  when: not (migration_decision_already_recorded | default(false) | bool)
  block:
    - name: Display embedding model change warning
      ansible.builtin.debug:
        msg: |
          ========================================
             EMBEDDING MODEL CHANGE DETECTED
          ========================================

          The embedding model is changing:
            FROM: {{ source_embedding_model }}
              TO: {{ target_embedding_model }}

          IMPORTANT IMPLICATIONS:
            - All existing documents MUST be re-embedded with the new model
            - Documents embedded with different models are incompatible
            - Until re-embedding is complete, some knowledge may be unavailable
            - Re-embedding can be time-consuming for large document collections

          YOUR OPTIONS:
            1. Keep the previous model ({{ source_embedding_model }})
               - No re-embedding required
               - All existing knowledge remains immediately available
               - Set embedding_model_name: "{{ source_embedding_model }}" in target config.yaml

            2. Switch to the new model ({{ target_embedding_model }})
               - Requires re-embedding all existing documents
               - A UI banner will guide users through the process
               - Knowledge unavailable until re-embedding completes

            3. Abort pre-upgrade assessment to review options

          ========================================

    - name: Validate embedding_model_decision_action if provided
      ansible.builtin.fail:
        msg: >-
          Invalid value for embedding_model_decision_action: '{{ embedding_model_decision_action }}'.
          Accepted values: 'keep' or 'use_new_model'.
      when:
        - embedding_model_decision_action is defined
        - embedding_model_decision_action not in ['keep', 'use_new_model']

    - name: Display automated-override notice
      ansible.builtin.debug:
        msg: >-
          embedding_model_decision_action='{{ embedding_model_decision_action }}' — skipping interactive prompt.
      when: embedding_model_decision_action is defined

    - name: Prompt for decision (interactive)
      ansible.builtin.pause:
        prompt: |

          How would you like to proceed?

          Enter your choice:
            [1] Keep previous model ({{ source_embedding_model }}) - No re-embedding needed
            [2] Use new model ({{ target_embedding_model }}) - Re-embedding required
            [3] Abort upgrade to review options

          Choice [1/2/3]:
      register: embedding_model_decision
      when: embedding_model_decision_action is not defined

    - name: Validate interactive input
      ansible.builtin.fail:
        msg: "Invalid choice '{{ embedding_model_decision.user_input }}'. Run pre-upgrade again and select 1, 2, or 3."
      when:
        - embedding_model_decision_action is not defined
        - embedding_model_decision.user_input not in ['1', '2', '3']

    - name: Abort on user request (interactive)
      ansible.builtin.fail:
        msg: |
          Pre-upgrade assessment aborted.
          To proceed: select 1 (keep model) or 2 (switch model) on next run.
      when:
        - embedding_model_decision_action is not defined
        - embedding_model_decision.user_input == '3'

    - name: Resolve effective action
      ansible.builtin.set_fact:
        _embedding_effective_action: >-
          {{
            (embedding_model_decision_action == 'keep') | ternary('1',
            (embedding_model_decision_action == 'use_new_model') | ternary('2',
            embedding_model_decision.user_input))
          }}

    - name: Record keep-previous decision
      ansible.builtin.set_fact:
        embedding_model_user_decision: "keep_previous"
        embedding_model_requires_reembedding: false
      when: _embedding_effective_action == '1'

    - name: Display keep-previous instructions
      ansible.builtin.debug:
        msg: |
          ========================================
          Decision: Keep Previous Model
          ========================================
          Update target config.yaml before running the upgrade:

            embedding_model_name: "{{ source_embedding_model }}"

          Then re-run pre-upgrade assessment to confirm no model change is detected.
          ========================================
      when: _embedding_effective_action == '1'

    - name: Fail after keep-previous — config must be updated before proceeding
      ansible.builtin.fail:
        msg: "Update embedding_model_name in target config.yaml to '{{ source_embedding_model }}' then re-run."
      when: _embedding_effective_action == '1'

    - name: Record use-new-model decision
      ansible.builtin.set_fact:
        embedding_model_user_decision: "use_new"
        embedding_model_requires_reembedding: true
      when: _embedding_effective_action == '2'

    - name: Create migration status ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: embedding-model-migration-status
            namespace: "{{ pipelines[0].namespace | default('chatqa') }}"
            annotations:
              description: "Embedding model migration decision — banner clears when all files are re-embedded"
          data:
            decision: "use_new"
            migration_required: "true"
            old_model: "{{ source_embedding_model }}"
            new_model: "{{ target_embedding_model }}"
            created_at: "{{ ansible_date_time.iso8601 }}"
      when: _embedding_effective_action == '2'

    - name: Display use-new-model confirmation
      ansible.builtin.debug:
        msg: |
          ========================================
          Decision: Switch to New Model
          ========================================
          The upgrade will proceed with: {{ target_embedding_model }}

          After upgrade completes:
            - A banner will appear in the UI
            - Re-ingest documents via Admin Panel -> Data Ingestion
            - Banner clears automatically when all files use the new model

          Continuing pre-upgrade assessment...
          ========================================
      when: _embedding_effective_action == '2'

- name: Record mitigation as applied
  ansible.builtin.set_fact:
    metadata_mitigations_applied: >-
      {{
        metadata_mitigations_applied + [{
          'component': current_mitigation.component,
          'action': current_mitigation.action,
          'change_path': current_mitigation.change_path,
          'decision': embedding_model_user_decision,
          'status': 'applied',
          'result': 'Decision: ' + embedding_model_user_decision,
          'timestamp': ansible_date_time.iso8601
        }]
      }}
  when: embedding_model_user_decision in ['use_new', 'no_change']
