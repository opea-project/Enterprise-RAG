---
- name: Get namespace for the first pipeline item with type chatqa (falls back to first pipeline namespace)
  ansible.builtin.set_fact:
    chatqa_namespace: >-
      {{
        (pipelines | selectattr('type', 'equalto', 'chatqa') | list | first).namespace
        if (pipelines | selectattr('type', 'equalto', 'chatqa') | list | length > 0)
        else (pipelines | first).namespace
      }}
  tags:
    - install
    - update-configuration

- name: Fail if no chatqa namespace is found
  ansible.builtin.fail:
    msg: "No pipeline item with type 'chatqa' found."
  when: chatqa_namespace is not defined or chatqa_namespace | length == 0
  tags:
    - install
    - update-configuration
