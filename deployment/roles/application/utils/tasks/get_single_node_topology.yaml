- name: Get CPU to NUMA node mapping
  kubernetes.core.k8s_exec:
    pod: "{{ pod_name }}"
    container: debian
    namespace: default
    command: lscpu -p=NODE,CPU
  environment:
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    ALL_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    all_proxy: ""
    NO_PROXY: "127.0.0.1,localhost,::1,10.233.0.1,.svc,.svc.cluster.local,.cluster.local"
    no_proxy: "127.0.0.1,localhost,::1,10.233.0.1,.svc,.svc.cluster.local,.cluster.local"
  register: cpu_numa_mapping
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Count CPUs per NUMA node
  ansible.builtin.shell: |
    echo "{{ cpu_numa_mapping.stdout }}" | grep -v '^#' | sed '/^\s*$/d' | awk -F, '{count[$1]++} END {for(i in count) print i" "count[i]}'
  register: cpu_counts_per_node
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Build CPU list per NUMA node
  ansible.builtin.shell: |
    echo "{{ cpu_numa_mapping.stdout }}" | grep -v '^#' | sed '/^\s*$/d' | awk -F, '{cpus[$1] = cpus[$1] ? cpus[$1]","$2 : $2} END {for(i in cpus) print i" "cpus[i]}'
  register: cpus_per_numa_raw
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Extract CPU counts
  ansible.builtin.shell: |
    echo "{{ cpu_counts_per_node.stdout }}" | awk '{print $2}'
  register: cpu_counts_raw
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Set CPU counts list
  set_fact:
    cpu_counts_list: "{{ cpu_counts_raw.stdout_lines | map('int') | list }}"
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Check if NUMA nodes are balanced
  set_fact:
    numa_balanced: "{{ cpu_counts_list | unique | length == 1 }}"
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Display warning if NUMA nodes are imbalanced
  ansible.builtin.debug:
    msg: >
      WARNING: Node {{ node_name }} NUMA nodes have uneven CPU distribution {{ cpu_counts_list }}.
      This is unusual and balloon policy may not be optimized for this topology.
      The smallest CPU per NUMA node will be taken for further calculations.
  when: not numa_balanced
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Get number of NUMA nodes
  ansible.builtin.shell: |
    echo "{{ cpu_counts_per_node.stdout }}" | wc -l
  register: numa_nodes_result
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Check for AMX support
  kubernetes.core.k8s_exec:
    pod: "{{ pod_name }}"
    container: debian
    namespace: default
    command: bash -c "lscpu | grep -i amx"
  environment:
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    ALL_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    all_proxy: ""
    NO_PROXY: "127.0.0.1,localhost,::1,10.233.0.1,.svc,.svc.cluster.local,.cluster.local"
    no_proxy: "127.0.0.1,localhost,::1,10.233.0.1,.svc,.svc.cluster.local,.cluster.local"
  register: amx_check
  ignore_errors: true
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Get all pods scheduled on this node
  kubernetes.core.k8s_info:
    kind: Pod
    field_selectors:
      - spec.nodeName={{ node_name }}
  environment:
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    ALL_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    all_proxy: ""
    NO_PROXY: "127.0.0.1,localhost,::1,10.233.0.1,.svc,.svc.cluster.local,.cluster.local"
    no_proxy: "127.0.0.1,localhost,::1,10.233.0.1,.svc,.svc.cluster.local,.cluster.local"
  register: pods_info
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Check if any pod name contains "habanalabs-device-plugin"
  set_fact:
    habana_plugin_present: >-
      {{
        pods_info.resources
        | selectattr('metadata.name', 'search', 'habana-ai-device-plugin|habanalabs-device-plugin')
        | list
        | length > 0
      }}
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Get total memory in GiB
  kubernetes.core.k8s_exec:
    pod: "{{ pod_name }}"
    container: debian
    namespace: default
    command: bash -c "grep MemTotal /proc/meminfo | awk '{print int($2/1024/1024)}'"
  environment:
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    ALL_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    all_proxy: ""
    NO_PROXY: "127.0.0.1,localhost,::1,10.233.0.1,.svc,.svc.cluster.local,.cluster.local"
    no_proxy: "127.0.0.1,localhost,::1,10.233.0.1,.svc,.svc.cluster.local,.cluster.local"
  register: total_memory_GiB
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Get threads per core
  kubernetes.core.k8s_exec:
    pod: "{{ pod_name }}"
    container: debian
    namespace: default
    command: bash -c "lscpu | grep 'Thread(s) per core' | awk '{print $NF}'"
  environment:
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    ALL_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    all_proxy: ""
    NO_PROXY: "127.0.0.1,localhost,::1,10.233.0.1,.svc,.svc.cluster.local,.cluster.local"
    no_proxy: "127.0.0.1,localhost,::1,10.233.0.1,.svc,.svc.cluster.local,.cluster.local"
  register: threads_per_core_result
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Reset cpus_per_numa_dict for this node
  set_fact:
    cpus_per_numa_dict: {}
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Parse CPU list per NUMA node into dict
  set_fact:
    cpus_per_numa_dict: >-
      {{
        cpus_per_numa_dict | combine({
          (line_parts[0] | string): (line_parts[1] | string)
        })
      }}
  loop: "{{ cpus_per_numa_raw.stdout_lines }}"
  loop_control:
    label: "NUMA {{ (item.split())[0] }}"
  vars:
    line_parts: "{{ item.split() }}"
  tags:
    - install
    - topology-preview
    - update-configuration

- name: Update cpu_topology_per_node dict
  set_fact:
    cpu_topology_per_node: >-
      {{
        cpu_topology_per_node | combine({
          node_name: {
            'numa_nodes': (numa_nodes_result.stdout | int),
            'cpus_per_numa_node': (cpu_counts_list | min),
            'amx_supported': (amx_check.rc == 0),
            'numa_balanced': numa_balanced,
            'gaudi': habana_plugin_present,
            'total_memory_GiB': (total_memory_GiB.stdout | int),
            'threads_per_core': (threads_per_core_result.stdout | int),
            'cpus_per_numa': cpus_per_numa_dict
          }
        })
      }}
  tags:
    - install
    - topology-preview
    - update-configuration
