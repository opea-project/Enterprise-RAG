---
- name: Remove Docker repository sources (DEB822 and legacy formats)
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/docker.sources
  tags:
    - configure
    - remove

- name: Uninstall Docker packages
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
      - docker
      - docker-engine
      - docker.io
      - runc
      - containerd
      - docker-buildx-plugin
    state: absent
    autoremove: yes
  tags:
    - configure
    - remove

- name: Remove Docker GPG key
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: absent
  tags:
    - configure
    - remove

- name: Install prerequisites for Docker repository
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
  environment:
    http_proxy: "{{ httpProxy | default('') }}"
    https_proxy: "{{ httpsProxy | default('') }}"
    no_proxy: "{{ noProxy | default('') }}"
  tags:
    - configure

- name: Create keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags:
    - configure

- name: Download Docker GPG key
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: true
  environment:
    http_proxy: "{{ httpProxy | default('') }}"
    https_proxy: "{{ httpsProxy | default('') }}"
    no_proxy: "{{ noProxy | default('') }}"
  tags:
    - configure

- name: Add Docker repository (DEB822 format)
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: {{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
      Signed-By: /etc/apt/keyrings/docker.asc
  tags:
    - configure

- name: Install Docker Engine
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  retries: 3
  delay: 30
  register: result
  until: result is succeeded
  environment:
    http_proxy: "{{ httpProxy | default('') }}"
    https_proxy: "{{ httpsProxy | default('') }}"
    no_proxy: "{{ noProxy | default('') }}"
  tags:
    - configure

- name: Add users to `docker` group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id  | default(lookup('env', 'USER')) }}"
    groups: ['docker']
    append: true
  tags:
    - configure

- name: "Create directory for docker config"
  ansible.builtin.file:
    path: "~/.docker/"
    state: directory
    mode: '0755'
  when: httpProxy != "" or httpsProxy != ""
  tags:
    - configure

- name: "Create docker proxy file"
  ansible.builtin.template:
    src: templates/config.json.j2
    dest: "~/.docker/config.json"
    mode: '0644'
  when: httpProxy != "" or httpsProxy != ""
  tags:
    - configure

- name: Check if Docker daemon.json exists
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: docker_daemon_json

- name: Backup existing Docker daemon.json
  ansible.builtin.copy:
    src: /etc/docker/daemon.json
    dest: /etc/docker/daemon.json.bak
    remote_src: true
  when: docker_daemon_json.stat.exists

- name: Create Docker daemon.json with proxy settings
  become: true
  ansible.builtin.template:
    src: templates/daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: '0644'
  when: httpProxy != "" or httpsProxy != "" or insecure_registry != ""
  tags:
    - configure

- name: Reload systemd manager configuration
  become: true
  ansible.builtin.command: systemctl daemon-reload
  when: httpProxy != "" or httpsProxy != ""
  tags:
    - configure

- name: Restart Docker
  become: true
  ansible.builtin.systemd:
    name: docker
    state: restarted
    enabled: true
  when: httpProxy != "" or httpsProxy != ""
  tags:
    - configure
