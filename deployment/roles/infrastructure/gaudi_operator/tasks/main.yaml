---
- name: Create namespace habana-ai-operator
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: habana-ai-operator
    state: present
  tags:
    - install
    - post-install

- name: Label namespace with pod security policies
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: habana-ai-operator
    definition:
      metadata:
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
  tags:
    - install
    - post-install

- name: Add and update Helm repo for Habana AI Operator
  kubernetes.core.helm_repository:
    name: gaudi-helm
    repo_url: https://vault.habana.ai/artifactory/api/helm/gaudi-helm
    state: present
    force_update: true
  tags:
    - install
    - post-install

- name: Pre-install Habana AI Operator CRDs
  ansible.builtin.shell: >-
    helm show crds gaudi-helm/habana-ai-operator
    --version {{ habana_driver_version }} | kubectl apply -f -
  register: crd_pre_install
  changed_when: "'created' in crd_pre_install.stdout or 'configured' in crd_pre_install.stdout"
  tags:
    - install
    - post-install

- name: Wait for Habana AI Operator API group to be available
  ansible.builtin.shell: kubectl api-resources --api-group=habanalabs.habana.ai
  register: api_check
  until: api_check.rc == 0 and 'ClusterPolicy' in api_check.stdout
  retries: 24
  delay: 10
  changed_when: false
  tags:
    - install
    - post-install

- name: Install or upgrade Habana AI Operator using Helm
  kubernetes.core.helm:
    name: habana-ai-operator
    chart_ref: gaudi-helm/habana-ai-operator
    chart_version: "{{ habana_driver_version }}"
    release_namespace: habana-ai-operator
    create_namespace: true
    state: present
    wait: true
    timeout: "{{ helm_timeout }}"
  tags:
    - install
    - post-install

- name: Wait for habana-ai-driver pod to be created
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: habana-ai-operator
  register: driver_pods
  until: >
    driver_pods.resources | selectattr('metadata.name', 'search', 'habana-ai-driver') | list | length > 0
  retries: 120
  delay: 15
  tags:
    - install
    - post-install

- name: Wait until habana-ai-driver pod is ready
  vars:
    pod_name: "{{ driver_pods.resources | selectattr('metadata.name', 'search', 'habana-ai-driver') | map(attribute='metadata.name') | first }}"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: habana-ai-operator
    name: "{{ pod_name }}"
  register: current_driver_pod
  until: >
    current_driver_pod.resources[0].status.conditions is defined and
    (
      current_driver_pod.resources[0].status.conditions
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list
      | length
    ) > 0
  retries: 50
  delay: 15
  tags:
    - install
    - post-install

- name: Wait for habana-ai-device-plugin pod to be created
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: habana-ai-operator
  register: plugin_pods
  until: >
    plugin_pods.resources | selectattr('metadata.name', 'search', 'habana-ai-device-plugin') | list | length > 0
  retries: 20
  delay: 5
  tags:
    - install
    - post-install

- name: Calculate retry count for pod readiness checks
  set_fact:
    wait_retries: "{{ ((helm_timeout | default('10m0s') | regex_replace('m0s$', '') | regex_replace('s$', '') | int) * 60 // 15) | default(40) }}"
  tags:
    - install
    - post-install

- name: Wait for all pods in habana-ai-operator namespace to be running
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: habana-ai-operator
  register: all_pods_running_check
  until: >
    all_pods_running_check.resources | length > 0 and
    all_pods_running_check.resources | selectattr('status.phase', 'equalto', 'Running') | list | length == all_pods_running_check.resources | length
  retries: "{{ wait_retries }}"
  delay: 30
  tags:
    - install
    - post-install

- name: Wait for all containers in pods to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: habana-ai-operator
  register: all_containers_ready_check
  until: >
    all_containers_ready_check.resources | selectattr('status.containerStatuses', 'defined') |
    map(attribute='status.containerStatuses') | sum(start=[]) |
    selectattr('ready', 'equalto', false) | list | length == 0
  retries: "{{ wait_retries }}"
  delay: 30
  failed_when: false
  tags:
    - install
    - post-install

- name: Fail if any Gaudi pod is not ready
  fail:
    msg: >-
      Not all pods in habana-ai-operator namespace became ready within the timeout ({{ helm_timeout | default('10m0s') }}).
      Check pod status with: kubectl get pods -n habana-ai-operator
  when: >
    all_containers_ready_check.resources | selectattr('status.containerStatuses', 'defined') |
    map(attribute='status.containerStatuses') | sum(start=[]) |
    selectattr('ready', 'equalto', false) | list | length > 0
  tags:
    - install
    - post-install


- name: Get all pods in the habana-ai-operator namespace
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: habana-ai-operator
  register: all_pods
  tags:
    - install
    - post-install

- name: Initialize unready pod list
  set_fact:
    unready_pods: []
  tags:
    - install
    - post-install

- name: Identify unready pods
  set_fact:
    unready_pods: "{{ unready_pods + [item.metadata.name] }}"
  loop: "{{ all_pods.resources }}"
  when: >
    item.status.phase != 'Running' or
    (
      item.status.containerStatuses is defined and
      (
        item.status.containerStatuses | selectattr('ready', 'equalto', false) | list | length > 0
      )
    )
  no_log: "{{ secure_logs }}"
  tags:
    - install
    - post-install

- name: Wait for Gaudi resources to be advertised in node status
  kubernetes.core.k8s_info:
    kind: Node
  register: habana_nodes
  until: >
    habana_nodes.resources | length > 0 and
    habana_nodes.resources
    | map(attribute='status.allocatable') | select('defined')
    | map('dict2items') | flatten
    | selectattr('key', 'equalto', 'habana.ai/gaudi')
    | selectattr('value', 'ne', '0') | list | length > 0
  retries: 15
  delay: 10
  tags:
    - install
    - post-install

- name: Initialize Gaudi node list
  set_fact:
    gaudi_nodes: []
  tags:
    - install
    - post-install

- name: Identify Gaudi nodes manually
  set_fact:
    gaudi_nodes: "{{ gaudi_nodes + [item] }}"
  loop: "{{ habana_nodes.resources }}"
  when: >
    item.status.allocatable is defined and
    (item.status.allocatable | dict2items
     | selectattr('key', 'equalto', 'habana.ai/gaudi') | list | length) > 0 and
    (item.status.allocatable | dict2items
     | selectattr('key', 'equalto', 'habana.ai/gaudi')
     | map(attribute='value') | first | default('0') | int) > 0
  no_log: "{{ secure_logs }}"
  tags:
    - install
    - post-install

- name: Print number of Gaudi nodes
  debug:
    msg: "Number of Gaudi nodes: {{ gaudi_nodes | length }}"
  tags:
    - install
    - post-install

- name: Initialize total Gaudi cards counter
  set_fact:
    total_gaudi_cards: 0
  tags:
    - install
    - post-install

- name: Count total Gaudi cards manually
  set_fact:
    total_gaudi_cards: >-
      {{ total_gaudi_cards | int +
         (item.status.allocatable | dict2items
          | selectattr('key', 'equalto', 'habana.ai/gaudi')
          | map(attribute='value') | first | default('0') | int) }}
  loop: "{{ gaudi_nodes }}"
  when: >
    item.status.allocatable is defined and
    (item.status.allocatable | dict2items
     | selectattr('key', 'equalto', 'habana.ai/gaudi') | list | length) > 0
  no_log: "{{ secure_logs }}"
  tags:
    - install
    - post-install

- name: Print total number of Gaudi cards
  debug:
    msg: "Total number of Gaudi cards: {{ total_gaudi_cards }}"
  tags:
    - install
    - post-install

- name: Find nodes with incorrect Habana Gaudi capacity
  set_fact:
    invalid_nodes: >-
      {%- set result = [] -%}
      {%- for node in gaudi_nodes -%}
        {%- if node.status.allocatable is defined
              and 'habana.ai/gaudi' in node.status.allocatable
              and node.status.allocatable['habana.ai/gaudi'] != '8' -%}
          {%- set _ = result.append(node.metadata.name) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}
  tags:
    - install
    - post-install

- name: Fail if any Gaudi node has incorrect capacity
  fail:
    msg: >-
      The following nodes do not have the correct Habana Gaudi capacity:
      {% for node in gaudi_nodes %}
        {% if node.metadata.name in invalid_nodes %}
          - {{ node.metadata.name }} (actual: {{ node.status.allocatable['habana.ai/gaudi'] }}, expected: 8)
        {% endif %}
      {% endfor %}
  when: invalid_nodes | length > 0
  tags:
    - install
    - post-install

- name: Uninstall Habana AI Operator Helm release
  kubernetes.core.helm:
    name: habana-ai-operator
    release_namespace: habana-ai-operator
    state: absent
  tags:
    - delete

- name: Remove pod security labels from habana-ai-operator namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: habana-ai-operator
    definition:
      metadata:
        labels:
          pod-security.kubernetes.io/enforce: null
          pod-security.kubernetes.io/audit: null
          pod-security.kubernetes.io/warn: null
  tags:
    - delete

- name: Delete namespace habana-ai-operator
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: habana-ai-operator
    state: absent
  tags:
    - delete
