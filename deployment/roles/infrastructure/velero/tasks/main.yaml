---
- name: Create tmp directory if it does not exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '755'
  loop:
    - "{{ log_dir }}"
    - "{{ tmp_dir }}"
  tags:
    - install
    - post-install

- name: Load credentials from password management
  ansible.builtin.include_role:
    name: password_mgmt
    tasks_from: lookup.yaml
    apply:
      tags:
        - install
        - post-install
  tags:
    - install
    - post-install

- name: Validate options
  fail:
    msg: "Configuration is not valid: enabling velero requires install_server or install_client to be true."
  when: not velero.install_server and not velero.install_client
  tags:
    - install
    - post-install

- name: Validate external BSL credentials configuration
  ansible.builtin.fail:
    msg: >-
      Invalid configuration: both credentials_secret and credentials_file_path are set.
      Use credentials_file_path to let Ansible create the secret automatically, OR
      use credentials_secret to reference a pre-existing Kubernetes secret — not both.
  when:
    - velero.external_bsl.enabled | default(false)
    - velero.external_bsl.credentials_secret | default('') != ''
    - velero.external_bsl.credentials_file_path | default('') != ''
  tags:
    - install
    - post-install

- name: Set roles facts
  ansible.builtin.set_fact:
    velero_helm_override_values_path: "{{ tmp_dir }}/{{ velero.helm.chart_name }}-override-values.yaml"
  tags:
    - install
    - post-install

- name: Ensure Helm repositories
  kubernetes.core.helm_repository:
    name: "{{ velero.helm.repo_name }}"
    repo_url: "{{ velero.helm.repo_url }}"
    state: present
  when: velero.install_server
  tags:
    - install
    - post-install

- name: Ensure SeaweedFS Helm repository
  kubernetes.core.helm_repository:
    name: "{{ velero.helm.repo_seaweedfs_name }}"
    repo_url: "{{ velero.helm.repo_seaweedfs_url }}"
    state: present
  # Skip when using external BSL: SeaweedFS is not deployed so the repo is not needed.
  # helm dependency build will use the cached tarball in components/velero/charts/ if present.
  when: velero.install_server and not (velero.external_bsl.enabled | default(false))
  tags:
    - install
    - post-install

- name: Build Helm chart dependencies
  ansible.builtin.command:
    cmd: helm dependency build
    chdir: "{{ velero.helm.chart_directory }}"
  when: velero.install_server
  register: helm_repo_add_result
  until: helm_repo_add_result is succeeded
  retries: 5
  delay: 15
  tags:
    - install
    - post-install

- name: Ensure namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ velero.namespace }}"
  tags:
    - install
    - post-install

- name: Load init passwords
  ansible.builtin.include_role:
    name: generate_password
    apply:
      tags:
        - install
        - post-install
  tags:
    - install
    - post-install

- name: Generate random string for SeaweedFS keys
  ansible.builtin.include_role:
    name: generate_password
    tasks_from: generate_key
    apply:
      tags:
        - install
        - post-install
  loop:
    - { name: VELERO_SEAWEEDFS_ACCESS_KEY }
    - { name: VELERO_SEAWEEDFS_SECRET_KEY }
  no_log: "{{ secure_logs }}"
  when: not (velero.external_bsl.enabled | default(false))
  tags:
    - install
    - post-install

- name: Set default StorageClass name for Velero
  ansible.builtin.set_fact:
    velero_storage_class_name: ""
  tags:
    - install
    - post-install

- name: Get all StorageClasses
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
  register: sc_list
  when: not (velero.external_bsl.enabled | default(false))
  tags:
    - install
    - post-install

- name: Determine StorageClass for Velero
  set_fact:
    velero_storage_class_name: >-
      {%- if velero.storage_class is defined and velero.storage_class != "" -%}
        {{ velero.storage_class }}
      {%- else -%}
        {%- for item in sc_list.resources -%}
          {%- if item.metadata.annotations is defined and item.metadata.annotations.get('storageclass.kubernetes.io/is-default-class', 'false') == 'true' -%}
            {{ item.metadata.name }}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
  when: not (velero.external_bsl.enabled | default(false))
  tags:
    - install
    - post-install

- name: Fail if no StorageClass available for Velero
  ansible.builtin.fail:
    msg: "No StorageClass available for Velero. Either set velero.storage_class in config.yaml or ensure a default StorageClass exists in your cluster."
  when: velero_storage_class_name == "" and not (velero.external_bsl.enabled | default(false))
  tags:
    - install
    - post-install

- name: Get the StorageClass object that Velero will use
  ansible.builtin.set_fact:
    velero_sc_object: >-
      {%- for item in sc_list.resources -%}
        {%- if item.metadata.name == velero_storage_class_name -%}
          {{ item }}
        {%- endif -%}
      {%- endfor -%}
  when: not (velero.external_bsl.enabled | default(false))
  tags:
    - install
    - post-install

- name: Fail if specified StorageClass not found
  ansible.builtin.fail:
    msg: "StorageClass '{{ velero_storage_class_name }}' not found in cluster. Available: {{ sc_list.resources | map(attribute='metadata.name') | list | join(', ') }}"
  when: velero_sc_object is defined and velero_sc_object == "" and not (velero.external_bsl.enabled | default(false))
  tags:
    - install
    - post-install

- name: Validate external BSL TLS configuration
  ansible.builtin.assert:
    that:
      - velero.external_bsl.tls.host_ip != ""
      - (velero.external_bsl.tls.ca_cert_path | default('') != '') or (velero.external_bsl.tls.ca_cert | default('') != '')
      - velero.external_bsl.s3_url is match("^https://")
    fail_msg: >-
      When external_bsl.tls.enabled is true, tls.host_ip and either
      tls.ca_cert_path or tls.ca_cert (base64) must be set. s3_url must
      start with https://.
      Run: deployment/components/external-seaweedfs/setup.sh --hostname <name>
  when:
    - velero.external_bsl.enabled | default(false)
    - velero.external_bsl.tls.enabled | default(false)
  tags:
    - install
    - post-install

- name: Read CA cert from file path
  ansible.builtin.slurp:
    src: "{{ velero.external_bsl.tls.ca_cert_path }}"
  register: ca_cert_file_content
  when:
    - velero.external_bsl.enabled | default(false)
    - velero.external_bsl.tls.enabled | default(false)
    - velero.external_bsl.tls.ca_cert_path | default('') != ''
  tags:
    - install
    - post-install

- name: Resolve CA cert for velero BSL (from path or inline)
  ansible.builtin.set_fact:
    velero_bsl_ca_cert_b64: >-
      {{ ca_cert_file_content.content | default('') if (velero.external_bsl.tls.ca_cert_path | default('') != '')
         else velero.external_bsl.tls.ca_cert | default('') }}
    velero_bsl_ca_cert_path: >-
      {{ velero.external_bsl.tls.ca_cert_path if (velero.external_bsl.tls.ca_cert_path | default('') != '')
         else '' }}
  when:
    - velero.external_bsl.enabled | default(false)
    - velero.external_bsl.tls.enabled | default(false)
  tags:
    - install
    - post-install

- name: Set empty CA cert facts when no external TLS
  ansible.builtin.set_fact:
    velero_bsl_ca_cert_b64: ""
    velero_bsl_ca_cert_path: ""
  when: not (velero.external_bsl.enabled | default(false) and velero.external_bsl.tls.enabled | default(false))
  tags:
    - install
    - post-install

- name: Extract BSL host from s3_url
  ansible.builtin.set_fact:
    bsl_host: "{{ (velero.external_bsl.s3_url | default('') | urlsplit('hostname')) if (velero.external_bsl.s3_url | default('')) != '' else '' }}"
    bsl_host_ip: "{{ velero.external_bsl.tls.host_ip | default('') }}"
  when: velero.external_bsl.enabled | default(false)
  tags:
    - install
    - post-install
    - delete
    - post-delete
    - velero-delete

- name: Set empty BSL host facts when no external BSL
  ansible.builtin.set_fact:
    bsl_host: ""
    bsl_host_ip: ""
  when: not (velero.external_bsl.enabled | default(false))
  tags:
    - install
    - post-install
    - delete
    - post-delete
    - velero-delete

- name: Determine BSL credentials secret name
  ansible.builtin.set_fact:
    velero_bsl_credentials_secret_name: >-
      {{ velero.external_bsl.credentials_secret if (velero.external_bsl.credentials_secret | default('') != '')
         else 'velero-bsl-credentials' }}
  when: velero.external_bsl.enabled | default(false)
  tags:
    - install
    - post-install

- name: Set default BSL credentials secret name when no external BSL
  ansible.builtin.set_fact:
    velero_bsl_credentials_secret_name: "velero-seaweedfs-access-secrets"
  when: not (velero.external_bsl.enabled | default(false))
  tags:
    - install
    - post-install
    - delete
    - post-delete
    - velero-delete

- name: Generate override values file from template
  ansible.builtin.template:
    src: "values.yaml.j2"
    dest: "{{ velero_helm_override_values_path }}"
    mode: '0644'
  tags:
    - install
    - post-install

- name: Define SeaweedFS S3 config for Velero
  ansible.builtin.set_fact:
    velero_s3_auth_config:
      identities:
        - name: "velero"
          credentials:
            - accessKey: "{{ VELERO_SEAWEEDFS_ACCESS_KEY }}"
              secretKey: "{{ VELERO_SEAWEEDFS_SECRET_KEY }}"
          actions:
            - "Read"
            - "Write"
            - "List"
            - "Tagging"
            - "Admin"
  when: not (velero.external_bsl.enabled | default(false))
  tags:
    - install
    - post-install

- name: Create SeaweedFS S3 secret for Velero
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: seaweedfs-s3-secret
        namespace: "{{ velero.namespace }}"
      type: Opaque
      data:
        admin_access_key_id: "{{ VELERO_SEAWEEDFS_ACCESS_KEY | b64encode }}"
        admin_secret_access_key: "{{ VELERO_SEAWEEDFS_SECRET_KEY | b64encode }}"
        seaweedfs_s3_config: "{{ velero_s3_auth_config | to_json | b64encode }}"
  when: not (velero.external_bsl.enabled | default(false))
  tags:
    - install
    - post-install

- name: Read credentials file for external BSL
  ansible.builtin.slurp:
    src: "{{ velero.external_bsl.credentials_file_path }}"
  register: bsl_credentials_file_content
  when:
    - velero.external_bsl.enabled | default(false)
    - velero.external_bsl.credentials_file_path | default('') != ''
  tags:
    - install
    - post-install

- name: Create BSL credentials secret from credentials file
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ velero_bsl_credentials_secret_name }}"
        namespace: "{{ velero.namespace }}"
      type: Opaque
      stringData:
        cloud: "{{ bsl_credentials_file_content.content | b64decode }}"
  when:
    - velero.external_bsl.enabled | default(false)
    - velero.external_bsl.credentials_file_path | default('') != ''
  no_log: "{{ secure_logs }}"
  tags:
    - install
    - post-install

- name: Verify external BSL credentials secret exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ velero_bsl_credentials_secret_name }}"
    namespace: "{{ velero.namespace }}"
  register: ext_bsl_secret_check
  when:
    - velero.external_bsl.enabled | default(false)
  tags:
    - install
    - post-install

- name: Fail if external BSL credentials secret is missing
  ansible.builtin.fail:
    msg: >-
      External BSL credentials secret '{{ velero_bsl_credentials_secret_name }}'
      not found in namespace '{{ velero.namespace }}'.
      Provide credentials_file_path to a credentials file (AWS format) for auto-creation,
      or set credentials_secret to the name of a pre-existing secret.
      Generate credentials with: deployment/components/external-seaweedfs/setup.sh
  when:
    - velero.external_bsl.enabled | default(false)
    - ext_bsl_secret_check.resources | length == 0
  tags:
    - install
    - post-install

- name: Write CA cert to disk for CLI use (from inline base64)
  ansible.builtin.copy:
    content: "{{ velero.external_bsl.tls.ca_cert | b64decode }}"
    dest: "{{ log_dir }}/velero-bsl-ca.crt"
    mode: '0644'
  when:
    - velero.external_bsl.enabled | default(false)
    - velero.external_bsl.tls.enabled | default(false)
    - velero.external_bsl.tls.ca_cert_path | default('') == ''
    - velero.external_bsl.tls.ca_cert | default('') != ''
  tags:
    - install
    - post-install

- name: Set velero CLI environment for external BSL with TLS
  ansible.builtin.set_fact:
    velero_cli_env:
      SSL_CERT_FILE: >-
        {{ velero_bsl_ca_cert_path if velero_bsl_ca_cert_path | default('') != ''
           else log_dir + '/velero-bsl-ca.crt' }}
      NO_PROXY: "{{ bsl_host }}{{ ',' + bsl_host_ip if bsl_host_ip and bsl_host_ip != bsl_host else '' }}"
      no_proxy: "{{ bsl_host }}{{ ',' + bsl_host_ip if bsl_host_ip and bsl_host_ip != bsl_host else '' }}"
  when:
    - velero.external_bsl.enabled | default(false)
    - velero.external_bsl.tls.enabled | default(false)
  tags:
    - install
    - post-install
    - delete
    - post-delete
    - velero-delete

- name: Set velero CLI environment for external BSL without TLS
  ansible.builtin.set_fact:
    velero_cli_env:
      NO_PROXY: "{{ bsl_host }}{{ ',' + bsl_host_ip if bsl_host_ip and bsl_host_ip != bsl_host else '' }}"
      no_proxy: "{{ bsl_host }}{{ ',' + bsl_host_ip if bsl_host_ip and bsl_host_ip != bsl_host else '' }}"
  when:
    - velero.external_bsl.enabled | default(false)
    - not (velero.external_bsl.tls.enabled | default(false))
  tags:
    - install
    - post-install
    - delete
    - post-delete
    - velero-delete

- name: Set empty velero CLI environment when no external BSL
  ansible.builtin.set_fact:
    velero_cli_env: {}
  when: not (velero.external_bsl.enabled | default(false))
  tags:
    - install
    - post-install
    - delete
    - post-delete
    - velero-delete

- name: Create VolumeSnapshotClass for NFS CSI driver
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: snapshot.storage.k8s.io/v1
      kind: VolumeSnapshotClass
      metadata:
        name: nfs-csi-snapclass
        labels:
          velero.io/csi-volumesnapshot-class: "true"
          meta.erag/sc-managed-by: "velero-role"
      driver: nfs.csi.k8s.io
      deletionPolicy: Delete
  when:
    - velero.enabled
    - velero.install_server
    - velero.install_snapshot_class
    - install_csi is defined
    - install_csi == "nfs"
  tags:
    - install
    - post-install

- name: Create ConfigMap with BSL CA certificate for velero pod
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: velero-bsl-ca-cert
        namespace: "{{ velero.namespace }}"
      data:
        ca.crt: "{{ velero_bsl_ca_cert_b64 | b64decode }}"
  when:
    - velero.external_bsl.enabled | default(false)
    - velero.external_bsl.tls.enabled | default(false)
    - velero_bsl_ca_cert_b64 | default('') != ''
  tags:
    - install
    - post-install

- name: Set values_files list
  ansible.builtin.set_fact:
    values_files: >
      {{
        [velero.helm.default_values_file] +
        [velero_helm_override_values_path]
      }}
  tags:
    - install
    - post-install

- name: Install or Upgrade Helm chart
  kubernetes.core.helm:
    name: "{{ velero.helm.release_name }}"
    chart_ref: "{{ velero.helm.chart_directory }}"
    namespace: "{{ velero.namespace }}"
    values_files: "{{ values_files }}"
    state: present
    dependency_update: true
    create_namespace: true
    timeout: "{{ helm_timeout }}"
    wait: true
  register: helm_repo_install_result
  until: helm_repo_install_result is succeeded
  retries: 5
  delay: 15
  tags:
    - install
    - post-install

- name: Mark SeaweedFS secrets for password management
  ansible.builtin.include_role:
    name: password_mgmt
    tasks_from: markup.yaml
    apply:
      tags:
        - install
        - post-install
  vars:
    namespace: "{{ velero.namespace }}"
    secret_name: "seaweedfs-s3-secret"
    password_mappings:
      - { key: admin_access_key_id, variable: VELERO_SEAWEEDFS_ACCESS_KEY, user: "" }
      - { key: admin_secret_access_key, variable: VELERO_SEAWEEDFS_SECRET_KEY, user: "" }
  when: not (velero.external_bsl.enabled | default(false))
  tags:
    - install
    - post-install

- name: Wait for velero pods to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ velero.namespace }}"
    label_selectors:
      - app.kubernetes.io/name=velero
      - name=velero
  register: velero_pods_info
  until: velero_pods_info.resources | length > 0 and velero_pods_info.resources[0].status.phase == "Running"
  retries: 30
  delay: 10
  tags:
    - install
    - post-install

- name: Get velero server running pod name
  ansible.builtin.set_fact:
    velero_pod_name: "{{ velero_pods_info.resources[0].metadata.name }}"
  tags:
    - install
    - post-install

- name: Wait for external BSL to become Available
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: BackupStorageLocation
    name: default
    namespace: "{{ velero.namespace }}"
  register: bsl_status
  until: >
    bsl_status.resources | length > 0 and
    (bsl_status.resources[0].status.phase | default('')) == 'Available'
  retries: 18
  delay: 10
  ignore_errors: true
  when:
    - velero.external_bsl.enabled | default(false)
  tags:
    - install
    - post-install

- name: Fail if external BSL did not become Available
  ansible.builtin.fail:
    msg: >
      External BSL 'default' is not Available
      (phase: '{{ (bsl_status.resources[0].status.phase | default('Unknown')) if bsl_status.resources | length > 0 else 'not found' }}').
      Check Velero logs: kubectl -n {{ velero.namespace }} logs deployment/velero | grep -i 'backupstoragelocation\|error'
      Verify: S3 endpoint reachability, bucket name, credentials format, region, and CA cert (if TLS).
  when:
    - velero.external_bsl.enabled | default(false)
    - bsl_status is defined
    - (bsl_status.resources | length == 0) or
      ((bsl_status.resources[0].status.phase | default('')) != 'Available')
  tags:
    - install
    - post-install

- name: Discover velero version
  kubernetes.core.k8s_exec:
    pod: "{{ velero_pod_name }}"
    container: velero
    namespace: "{{ velero.namespace }}"
    command: /velero version
  register: velero_version_check
  tags:
    - install
    - post-install

- name: Extract velero server version
  ansible.builtin.set_fact:
    velero_server_version: "{{ (velero_version_check.stdout | replace('\t', '  ') | from_yaml).Server.Version }}"
  tags:
    - install
    - post-install

- name: Verify velero server reports correct version
  fail:
    msg: "Can't identify velero server version to confirm it's working"
  when:
    velero_server_version is not regex('^[vV][0-9]+\.[0-9]+\.[0-9]+$')
  tags:
    - install
    - post-install

- name: Select velero client version to install
  ansible.builtin.set_fact:
    velero_client_target_version: >-
      {{ velero.client_version if (velero.client_version != "automatic") else velero_server_version }}
  when:
    velero.install_client
  tags:
    - install
    - post-install

- name: Discover local velero client version
  ansible.builtin.command: velero version
  register: velero_local_client_check
  ignore_errors: true
  when:
    velero.install_client
  tags:
    - install
    - post-install

- name: Extract local velero client version
  ansible.builtin.set_fact:
    velero_local_client_version: "{{ (velero_local_client_check.stdout | replace('\t', '  ') | from_yaml).Client.Version }}"
  when:
    velero.install_client and velero_local_client_check.rc == 0
  tags:
    - install
    - post-install

- name: Decide if velero client needs to be installed
  ansible.builtin.set_fact:
    velero_do_install_client: >-
      {{ velero_local_client_check.rc != 0 or velero_local_client_version  != velero_client_target_version }}
  when:
    velero.install_client
  tags:
    - install
    - post-install

- name: Download velero client archive
  ansible.builtin.get_url:
    url: https://github.com/vmware-tanzu/velero/releases/download/{{velero_client_target_version}}/velero-{{velero_client_target_version}}-linux-amd64.tar.gz
    dest: /tmp/velero-{{ velero_client_target_version }}-linux-amd64.tar.gz
    mode: '0644'
  when:
    velero.install_client and velero_do_install_client
  tags:
    - install
    - post-install

- name: Extract velero binary
  become: true
  ansible.builtin.unarchive:
    src: /tmp/velero-{{ velero_client_target_version }}-linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - "--strip-components=1"
  when:
    velero.install_client and velero_do_install_client
  tags:
    - install
    - post-install

- name: Set ownership and permissions for velero binary
  become: true
  ansible.builtin.file:
    path: /usr/local/bin/velero
    owner: "{{ ansible_user_id | default(lookup('env', 'USER')) }}"
    mode: '0755'
  when:
    velero.install_client and velero_do_install_client
  tags:
    - install
    - post-install

- name: Discover velero client version
  ansible.builtin.command: velero version
  register: velero_client_version_check
  ignore_errors: true
  tags:
    - install
    - post-install

- name: Sanity check - fail if velero client is unavailable and not requested to install
  fail:
    msg: >
      Velero client is unavailable and not enabled for install.
      Backup and restore procedures can't be enabled.
      Install velero client separately or enable it in config.yaml (install_client: true).
  when:
    - velero_client_version_check.rc != 0 and not velero.install_client
  tags:
    - install
    - post-install

- name: Extract velero client version
  ansible.builtin.set_fact:
    velero_client_version: "{{ (velero_client_version_check.stdout | replace('\t', '  ') | from_yaml).Client.Version }}"
  tags:
    - install
    - post-install

- name: Print out discovered client version
  ansible.builtin.debug:
    msg: "[DEBUG]: Discovered client version: {{ velero_client_version }}"
  tags:
    - install
    - post-install

- name: Verify velero client reports correct version
  fail:
    msg: "Can't identify velero client version to confirm it's working"
  when:
    velero_client_version is not regex('^[vV][0-9]+\.[0-9]+\.[0-9]+$')
  tags:
    - install
    - post-install

- name: Verify that velero client and server versions match
  ansible.builtin.debug:
    msg: >
      [WARNING]: Velero client and server versions do not match: client version: {{ velero_client_version }} and server version: {{ velero_server_version }}. This may impact correctness of the backup and restore procedures.
  when:
    - velero_client_version != velero_server_version
  tags:
    - install
    - post-install

- name: Remove tmp directory
  ansible.builtin.file:
    path: "{{ tmp_dir }}"
    state: absent
  tags:
    - install
    - post-install

- name: Generate velero CLI environment snippet for external BSL
  ansible.builtin.copy:
    content: |
      # Source this file to configure velero CLI for external BSL access.
      # Usage: source {{ log_dir }}/velero-env.sh
      {% if velero.external_bsl.tls.enabled | default(false) %}
      {% set cert_path = velero_bsl_ca_cert_path if velero_bsl_ca_cert_path | default('') != '' else log_dir + '/velero-bsl-ca.crt' %}
      export SSL_CERT_FILE="{{ cert_path }}"
      {% endif %}
      {% set bsl_host = (velero.external_bsl.s3_url | default('') | urlsplit('hostname')) if (velero.external_bsl.s3_url | default('')) != '' else '' %}
      {% set bsl_host_ip = velero.external_bsl.tls.host_ip | default('') %}
      {% set extra_entries = ([bsl_host] if bsl_host else []) + ([bsl_host_ip] if bsl_host_ip and bsl_host_ip != bsl_host else []) %}
      _velero_no_proxy="{{ extra_entries | join(',') }}"
      if [ -n "${no_proxy:-}" ]; then
        export no_proxy="${no_proxy},${_velero_no_proxy}"
      else
        export no_proxy="${_velero_no_proxy}"
      fi
      export NO_PROXY="$no_proxy"
      unset _velero_no_proxy
    dest: "{{ log_dir }}/velero-env.sh"
    mode: '0644'
  when:
    - velero.external_bsl.enabled | default(false)
  tags:
    - install
    - post-install

- name: Display velero CLI hints for external BSL
  ansible.builtin.debug:
    msg: |
      External BSL configured. For ad-hoc velero CLI usage, either:
        source {{ log_dir }}/velero-env.sh
      or ensure no_proxy includes the BSL host{{ ' and SSL_CERT_FILE points to the CA cert' if (velero.external_bsl.tls.enabled | default(false)) else '' }}.
  when:
    - velero.external_bsl.enabled | default(false)
  tags:
    - install
    - post-install

- name: Get all Restore objects
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: Restore
    namespace: "{{ velero.namespace }}"
  register: restore_objects
  when:
    - velero.enabled
    - velero.install_server
  tags:
    - delete
    - post-delete
    - velero-delete

- name: Delete all Restore objects using velero CLI (internal BSL - deletes data)
  ansible.builtin.command:
    cmd: velero restore delete {{ item.metadata.name }} --confirm --namespace {{ velero.namespace }}
  environment: "{{ velero_cli_env | default({}) }}"
  loop: "{{ restore_objects.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - velero.enabled
    - velero.install_server
    - restore_objects.resources | length > 0
    - not (velero.external_bsl.enabled | default(false))
  ignore_errors: true
  tags:
    - delete
    - post-delete
    - velero-delete

- name: Delete Restore CRs only (external BSL - preserve data in remote storage)
  kubernetes.core.k8s:
    api_version: velero.io/v1
    kind: Restore
    name: "{{ item.metadata.name }}"
    namespace: "{{ velero.namespace }}"
    state: absent
  loop: "{{ restore_objects.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - velero.enabled
    - velero.install_server
    - restore_objects.resources | length > 0
    - velero.external_bsl.enabled | default(false)
  ignore_errors: true
  tags:
    - delete
    - post-delete
    - velero-delete

- name: Get all Backup objects
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: Backup
    namespace: "{{ velero.namespace }}"
  register: backup_objects
  when:
    - velero.enabled
    - velero.install_server
  tags:
    - delete
    - post-delete
    - velero-delete

- name: Delete all Backup objects using velero CLI (internal BSL - deletes data)
  ansible.builtin.command:
    cmd: velero backup delete {{ item.metadata.name }} --confirm --namespace {{ velero.namespace }}
  environment: "{{ velero_cli_env | default({}) }}"
  loop: "{{ backup_objects.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - velero.enabled
    - velero.install_server
    - backup_objects.resources | length > 0
    - not (velero.external_bsl.enabled | default(false))
  ignore_errors: true
  tags:
    - delete
    - post-delete
    - velero-delete

- name: Delete Backup CRs only (external BSL - preserve data in remote storage)
  kubernetes.core.k8s:
    api_version: velero.io/v1
    kind: Backup
    name: "{{ item.metadata.name }}"
    namespace: "{{ velero.namespace }}"
    state: absent
  loop: "{{ backup_objects.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - velero.enabled
    - velero.install_server
    - backup_objects.resources | length > 0
    - velero.external_bsl.enabled | default(false)
  ignore_errors: true
  tags:
    - delete
    - post-delete
    - velero-delete

- name: Uninstall Velero Helm chart
  kubernetes.core.helm:
    name: "{{ velero.helm.release_name }}"
    namespace: "{{ velero.namespace }}"
    state: absent
  when:
    - velero.enabled
    - velero.install_server
  tags:
    - delete
    - post-delete
    - velero-delete

- name: Delete VolumeSnapshotClasses created by Velero role
  kubernetes.core.k8s:
    state: absent
    api_version: snapshot.storage.k8s.io/v1
    kind: VolumeSnapshotClass
    label_selectors:
      - meta.erag/sc-managed-by=velero-role
  when:
    - velero.enabled
    - velero.install_server
  ignore_errors: true
  tags:
    - delete
    - post-delete
    - velero-delete

- name: Wait for velero and seaweedfs pods to be deleted
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ velero.namespace }}"
    label_selectors:
      - app.kubernetes.io/name in (velero,seaweedfs)
  register: velero_pods_info
  until: velero_pods_info.resources | length == 0
  retries: 30
  delay: 10
  when:
    - velero.enabled
    - velero.install_server
  tags:
    - delete
    - post-delete
    - velero-delete

- name: Delete velero namespace
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ velero.namespace }}"
  when:
    - velero.enabled
    - velero.install_server
  tags:
    - delete
    - post-delete
    - velero-delete
