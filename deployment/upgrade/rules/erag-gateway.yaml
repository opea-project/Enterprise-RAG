# Component-specific validation rules for erag-gateway
# New component introduced in 2.2.0, replacing ingress-nginx.
# All additions are expected during first upgrade to 2.2.0.

validation_rules:
  - path_regex: ".*"
    response: "approve"
    note: "Gateway component additions approved - new component replacing ingress-nginx"
