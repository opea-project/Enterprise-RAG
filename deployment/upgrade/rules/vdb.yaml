---
# Component-specific validation rules for vdb
# These rules are checked FIRST (before default rules)
# Using first-match logic: the first matching rule determines the action

validation_rules:
  # - path_regex: ".*release-values-yaml/redis"
  #   data_regex: "\\s+enabled: true"
  #   response: "approve"
  #   note: "Approve switching to Redis standalone"

  # - path_regex: ".*release-values-yaml/redis-cluster"
  #   data_regex: "\\s+enabled: true"
  #   response: "approve"
  #   note: "Approve switching to Redis cluster"

  - path_regex: ".*release-values-yaml/(redis|redis-cluster)$"
    data_regex: "\\s+commonConfiguration:.*"
    response: "approve"
    note: "Approve changes in Redis common configuration"

  - path_regex: ".*release-values-yaml/redis-cluster/redis$"
    data_regex: "\\s+configmap:.*"
    response: "approve"
    note: "Approve changes in Redis common configuration"

  - path_regex: ".*redis-cluster/redis/resources/(requests|limits).*"
    response: "approve"
    note: "[2.1.1/2.2.0] Redis cluster resource adjustment - approved for performance/cost tuning"

  # Broader redis-cluster changes for gateway migration
  - path_regex: ".*redis-cluster/redis.*"
    response: "approve"
    note: "Approve Redis cluster configuration changes"

  - path_regex: ".*qdrant/resources/(requests|limits).*"
    response: "approve"
    note: "Qdrant resource adjustment - approved for performance/cost tuning"

  - path_regex: ".*qdrant/(persistence|snapshotPersistence)/(size|storageClassName).*"
    response: "reject"
    note: "Qdrant volume size or storage class change cannot be applied to existing PVCs by a StatefulSet update"

  - path_regex: ".*qdrant/image/tag.*"
    response: "reject"
    note: "Qdrant server version change needs an explicit migration decision: a downgrade cannot read a newer storage format"

  - path_regex: ".*qdrant/config/storage/on_disk_payload.*"
    response: "reject"
    note: "Qdrant on-disk payload change rewrites the storage layout of every existing collection"

  - path_regex: ".*qdrant/config/cluster.*"
    response: "reject"
    note: "Qdrant clustering change requires a resharding plan, not a StatefulSet update"

  - path_regex: ".*release-values-yaml/qdrant.*"
    response: "approve"
    note: "Approve remaining Qdrant configuration changes"

  - path_regex: ".*"
    response: "reject"
    note: "Uncategorized vdb changes require explicit approval"
