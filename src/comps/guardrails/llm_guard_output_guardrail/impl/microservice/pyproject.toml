[project]
name = "Intel-Enterprise-RAG-LLM_Guard_Output_Guardrail_Microservice"
version = "2.3.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "pip==26.1",
    "nltk==3.9.4",
    "llm-guard==0.3.16",
    "pyyaml==6.0.1",
    "docarray[full]==0.40.0",
    "aiohttp==3.14.1",
    "fastapi==0.136.3",
    "httpx==0.27.0",
    "langsmith==0.8.0",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "prometheus-fastapi-instrumentator==8.0.0",
    "sentence_transformers==3.0.1",
    "shortuuid==1.0.13",
    "uvicorn==0.30.1",
    "optimum[onnxruntime]==1.25.2",
    "torch==2.11.0",
    "jinja2==3.1.6",
    "python-dotenv==1.2.2",
    "h11==0.16.0",
    "requests == 2.33.1",
    "urllib3>=2.6.3,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "fastapi==0.136.3",
    "docarray[full]==0.40.0",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp==1.39.1",
    "opentelemetry-sdk==1.39.1",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.1.1",
  "protobuf>=6.33.5",
  "setuptools >= 80.10.2",
]

[tool.uv]
override-dependencies = [
    "cryptography>=46.0.5", # llm-guard dependency
    "transformers==4.57.6", # llm-guard dependency
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
