[project]
name = "Intel-Enterprise-RAG-Retriever_Microservice"
version = "2.3.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "Intel-Enterprise-RAG-VectorStores",
    "fastapi==0.136.3",
    "aiohttp==3.14.1",
    "opentelemetry-api==1.40.0",
    "opentelemetry-exporter-otlp==1.40.0",
    "opentelemetry-sdk==1.40.0",
    "prometheus-fastapi-instrumentator==8.0.0",
    "numpy==2.1.0",
    "docarray[full]==0.40.0",
    "uvicorn==0.30.1",
    "jinja2==3.1.6",
    "python-dotenv==1.2.2",
    "h11==0.16.0",
    "setuptools == 80.10.2",     # security update,
    "urllib3>=2.6.3,<3.0.0",
    "pyyaml==6.0.3",
    "spacy==3.8.11",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "fastapi==0.136.3",
    "aiohttp==3.14.1",
    "docarray[full]==0.40.0",
    "opentelemetry-api==1.40.0",
    "opentelemetry-exporter-otlp==1.40.0",
    "opentelemetry-sdk==1.40.0",
]

[tool.uv.sources]
Intel-Enterprise-RAG-VectorStores = { path = "../../../vectorstores/impl/requirements" }

[dependency-groups]
security-overrides = [
  "pillow>=12.1.1",
  "protobuf>=6.33.5",
]
