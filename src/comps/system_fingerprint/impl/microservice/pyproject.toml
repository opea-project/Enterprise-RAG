[project]
name = "Intel-Enterprise-RAG-System_Fingerprint_Microservice"
version = "2.3.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "beanie==1.26.0",
    "motor==3.4.0",
    "aiohttp==3.14.1",
    "docarray==0.40.0",
    "fastapi==0.136.3",
    "httpx==0.27.0",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-semantic-conventions==0.60b1",
    "prometheus-fastapi-instrumentator==8.0.0",
    "pymongo==4.8.0",
    "pyyaml==6.0.1",
    "requests==2.33.1",
    "shortuuid==1.0.13",
    "uvicorn==0.30.1",
    "jinja2==3.1.6",
    "python-dotenv==1.2.2",
    "h11==0.16.0",
    "urllib3>=2.6.3,<3.0.0",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.1.1",
  "protobuf>=6.33.5",
]
