[project]
name = "Intel-Enterprise-RAG-Text_Compression_Microservice"
version = "2.3.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "docarray[full] == 0.40.0",
    "fastapi == 0.136.3",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "prometheus-fastapi-instrumentator == 8.0.0",
    "shortuuid == 1.0.13",
    "uvicorn == 0.30.1",
    "python-dotenv == 1.2.2",
    "aiohttp == 3.14.1",
    "pyyaml == 6.0.2",
    "nltk==3.9.4",
    "requests == 2.33.1",
    "urllib3>=2.6.3,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "fastapi==0.136.3",
    "docarray[full]==0.40.0",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp==1.39.1",
    "opentelemetry-sdk==1.39.1",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.1.1",
  "protobuf>=6.33.5",
]
