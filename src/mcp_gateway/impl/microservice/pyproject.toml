[project]
name = "Intel-Enterprise-RAG-MCP_Gateway"
version = "2.3.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "uvicorn==0.31.1",
    "starlette>=1.0.1,<2.0.0",
    "httpx==0.28.1",
    "certifi>=2024.8.30",
    "mcp==1.27.2",
    "python-dotenv==1.2.2",
    "h11==0.16.0",
    "anyio==4.9.0",
    "validators==0.34.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "respx==0.22.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
security-overrides = [
    "urllib3>=2.6.3",
]
