      files: [test_docx_formatted_text.docx]
      questions:
        - question: "Jak brzmi pełne imię dziewczyny o nazwisku Lucifelle?"
          expected_any: ["lunibelle", "dźwięk"]
        - question: "W historii o Lunibelle Lucifelle, co dziewczyna uwielbiała zbierać?"
          expected_any: ["dźwięk"]
