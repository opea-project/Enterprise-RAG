          expected_any: ["pudełko", "wyszeptała", "niebo"]
        - question: "Jaki dźwięk wydawał deszcz w historii o Lunibelle Lucifelle?"
          expected_any: ["klaska", "dłoni"]
        - question: "Jak ludzie reagują, gdy słyszą, że wiatr gra cichą melodię w historii o Lunibelle Lucifelle?"
